<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפוס למידה דיגיטלי</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #0d9488;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --radius-lg: 20px;
      --radius-md: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body { background-color: var(--bg-main); font-family: 'Assistant', sans-serif; color: var(--text-main); }
    .main-container { max-width: 1100px; margin: 40px auto; background: var(--card-bg); padding: 40px; border-radius: var(--radius-lg); box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03); }
    
    /* תצוגת מסך מלא */
    body.kiosk-mode { background-color: #ffffff !important; padding: 0 !important; margin: 0 !important; }
    body.kiosk-mode #topNav, body.kiosk-mode .no-print, body.kiosk-mode .nav-pills, body.kiosk-mode .site-header-area { display: none !important; }
    body.kiosk-mode .main-container { max-width: 100% !important; width: 100vw !important; min-height: 100vh !important; margin: 0 !important; padding: 30px !important; border-radius: 0 !important; box-shadow: none !important; }
    
    /* עיצוב השיעור הנוכחי */
    .current-slot { border: 3px solid var(--accent) !important; background-color: #f0fdfa !important; transform: scale(1.02); }
    .current-slot .slot-header { background-color: var(--accent) !important; color: white !important; }

    .teacher-row { background: var(--card-bg); border-radius: var(--radius-md); border: 1px solid #e2e8f0; margin-bottom: 25px; padding: 20px; }
    .teacher-label-zone { font-weight: 700; color: var(--primary); font-size: 1.1rem; border-bottom: 2px solid var(--primary-light); padding-bottom: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .slots-grid-container { display: flex; flex-wrap: wrap; gap: 15px; }
    .slot-card { background: var(--bg-main); border: 1px solid #e2e8f0; border-radius: 10px; min-width: 220px; flex: 1; transition: var(--transition); overflow: hidden; display: flex; flex-direction: column; }
    .slot-header { background: #e2e8f0; font-size: 0.85rem; padding: 8px 14px; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .slot-room { font-size: 0.85rem; color: var(--accent); padding: 10px 14px 0 14px; font-weight: 700; }
    .slot-content { font-size: 0.95rem; padding: 8px 14px 14px 14px; color: var(--text-main); font-weight: 600; flex-grow: 1; }
    
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    @media (max-width: 768px) { .slot-card { min-width: 100%; width: 100%; } }
  </style>
</head>
<body>

<div id="loader" class="loading-overlay"><div class="spinner-border text-primary"></div></div>

<div id="appScreen" class="main-container container" style="display: none;">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3 no-print site-header-area">
    <h5 class="fw-bold m-0 text-dark">קמפוס למידה דיגיטלי</h5>
  </div>

  <ul class="nav nav-pills nav-justified mb-4 no-print" id="topNav">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-personal">👤 תלמיד</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-daily" onclick="drawDaily('ראשון')">📅 לו"ז יומי</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-personal">
        <input type="text" id="pSearch" class="form-control rounded-pill py-3 px-4 shadow-sm" placeholder="חפש תלמיד..." oninput="searchPersonal()">
        <div id="pGrid" class="row row-cols-1 row-cols-md-5 g-3 mt-3"></div>
    </div>
    <div class="tab-pane fade" id="tab-daily">
      <div id="dailyContent"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let GLOBAL_DB = null;
  window.onload = async () => {
    const res = await fetch('data.json');
    GLOBAL_DB = await res.json();
    document.getElementById('loader').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
  };

  function drawDaily(activeDay) {
    const now = new Date();
    const currentHour = now.getHours() + (now.getMinutes() / 60);
    
    let isKiosk = document.body.classList.contains('kiosk-mode');
    const rows = GLOBAL_DB.schedule[activeDay] || [];
    let contentHtml = `
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5>לו"ז ${activeDay}</h5>
        <button class="btn btn-sm ${isKiosk ? 'btn-danger' : 'btn-outline-primary'} rounded-pill" onclick="toggleKioskMode('${activeDay}')">
          ${isKiosk ? 'יציאה ממסך מלא' : 'מסך מלא'}
        </button>
      </div>`;

    if (rows.length > 1) {
      const headers = rows[0];
      rows.slice(1).forEach(row => {
        let slotsHtml = "";
        for (let j = 2; j < headers.length; j++) {
          if (row[j] && row[j].trim()) {
            const [start, end] = headers[j].split('-').map(t => {
                const [h, m] = t.split(':').map(Number);
                return h + (m/60);
            });
            const isCurrent = (currentHour >= start && currentHour < end) ? "current-slot" : "";
            
            slotsHtml += `
              <div class="slot-card shadow-sm ${isCurrent}">
                <div class="slot-header">
                  <span>${headers[j]}</span>
                  ${isCurrent ? '<small class="badge bg-accent text-white">כעת</small>' : ''}
                </div>
                <div class="slot-content">${row[j].split('-').slice(1).join('-')}</div>
              </div>`;
          }
        }
        contentHtml += `<div class="teacher-row"><div class="teacher-label-zone">${row[1]}</div><div class="slots-grid-container">${slotsHtml}</div></div>`;
      });
    }
    document.getElementById('dailyContent').innerHTML = contentHtml;
  }

  function toggleKioskMode(day) {
    document.body.classList.toggle('kiosk-mode');
    drawDaily(day);
  }

  // רענון אוטומטי כל דקה
  setInterval(() => {
    const activeBtn = document.querySelector('.btn-primary');
    if(document.getElementById('tab-daily').classList.contains('active')) {
       // רענון אוטומטי בהתאם ליום שנבחר
       drawDaily(document.querySelector('.btn-primary')?.innerText.replace('יום ','') || 'ראשון');
    }
  }, 60000);
</script>
</body>
</html>
