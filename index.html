<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מרכז למידה - מערכת ניהול</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --primary: #1e3a8a; --accent: #0d9488; --bg: #f8fafc; }
    body { background-color: var(--bg); font-family: 'Assistant', sans-serif; }
    
    /* מכולות ותצוגה */
    .main-container { max-width: 1100px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    body.kiosk-mode .main-container { max-width: 100% !important; margin: 0; border-radius: 0; min-height: 100vh; }
    
    /* כפתור מצב מלא */
    #kiosk-toggle-btn { position: fixed; top: 20px; left: 20px; z-index: 9999; }
    body.kiosk-mode #kiosk-toggle-btn { opacity: 0.3; } /* שקיפות במצב מלא שלא יפריע */

    /* ציר זמן אנכי */
    #timeline-container { display: none; position: fixed; right: 10px; top: 80px; height: 80vh; width: 6px; background: #e2e8f0; z-index: 1000; border-radius: 3px; }
    body.kiosk-mode #timeline-container { display: block; }
    #time-pointer { position: absolute; right: -7px; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; transition: top 0.5s linear; }

    .teacher-row { background: #fff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .slots-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; }
    .slot-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; flex: 1; min-width: 180px; }
    .current-slot { border: 3px solid var(--accent) !important; background-color: #f0fdfa !important; transform: scale(1.02); }
  </style>
</head>
<body>

<button id="kiosk-toggle-btn" class="btn btn-primary no-print" onclick="toggleKiosk()">מצב מסך מלא</button>

<div id="timeline-container"><div id="time-pointer"></div></div>

<div id="appScreen" class="main-container">
  <h4 class="fw-bold mb-4 no-print">ניהול מרכז למידה</h4>
  <div id="dailyContent"></div>
</div>

<script>
  let GLOBAL_DB = null;
  const START_HOUR = 8, END_HOUR = 16;

  window.onload = async () => {
    try {
      const res = await fetch('data.json');
      GLOBAL_DB = await res.json();
      renderDay('ראשון');
      setInterval(() => renderDay('ראשון'), 60000);
    } catch (e) { console.error("Error loading data:", e); }
  };

  function renderDay(day) {
    if (!GLOBAL_DB) return;
    const now = new Date();
    const currentHour = now.getHours() + (now.getMinutes() / 60);
    const data = GLOBAL_DB.schedule[day] || [];
    let html = '';
    
    data.slice(1).forEach(row => {
      html += `<div class="teacher-row"><h5>${row[1]}</h5><div class="slots-grid">`;
      data[0].slice(2).forEach((header, idx) => {
        const [start, end] = header.split('-').map(t => t.split(':').reduce((h, m) => parseInt(h) + parseInt(m)/60));
        const isCurrent = (currentHour >= start && currentHour < end);
        if (row[idx+2] && row[idx+2].trim() !== "") {
            html += `<div class="slot-card ${isCurrent ? 'current-slot' : ''}">
                        <div class="small text-muted">${header}</div>
                        <div class="fw-bold">${row[idx+2]}</div>
                     </div>`;
        }
      });
      html += `</div></div>`;
    });
    document.getElementById('dailyContent').innerHTML = html;
    updateStatus();
  }

  function updateStatus() {
    const now = new Date();
    const time = now.getHours() + (now.getMinutes() / 60);
    const pct = ((time - START_HOUR) / (END_HOUR - START_HOUR)) * 100;
    const pointer = document.getElementById('time-pointer');
    if(pointer) pointer.style.top = Math.max(0, Math.min(100, pct)) + "%";
    
    if(document.body.classList.contains('kiosk-mode')) {
      const active = document.querySelector('.current-slot');
      if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function toggleKiosk() {
    const btn = document.getElementById('kiosk-toggle-btn');
    const body = document.body;

    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().then(() => {
        body.classList.add('kiosk-mode');
        btn.innerText = "יציאה ממסך מלא";
        btn.classList.replace('btn-primary', 'btn-danger');
      });
    } else {
      document.exitFullscreen().then(() => {
        body.classList.remove('kiosk-mode');
        btn.innerText = "מצב מסך מלא";
        btn.classList.replace('btn-danger', 'btn-primary');
      });
    }
    updateStatus();
  }

  // האזנה ל-ESC
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      document.body.classList.remove('kiosk-mode');
      const btn = document.getElementById('kiosk-toggle-btn');
      btn.innerText = "מצב מסך מלא";
      btn.classList.replace('btn-danger', 'btn-primary');
    }
  });
</script>
</body>
</html>
