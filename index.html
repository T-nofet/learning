<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפוס למידה דיגיטלי</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #0d9488;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --radius-lg: 20px;
      --radius-md: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body { 
      background-color: var(--bg-main); 
      font-family: 'Assistant', sans-serif; 
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .main-container { 
      max-width: 1100px; 
      margin: 40px auto; 
      background: var(--card-bg); 
      padding: 40px; 
      border-radius: var(--radius-lg); 
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03), 0 2px 10px -1px rgba(0, 0, 0, 0.02); 
    }
    
    .auth-card {
      max-width: 400px;
      margin: 120px auto;
      background: var(--card-bg);
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
    }

    .nav-pills { background: #f1f5f9; padding: 6px; border-radius: 30px; border: 1px solid #e2e8f0; }
    .nav-pills .nav-link { border-radius: 24px; color: var(--text-muted); font-weight: 600; transition: var(--transition); border: none; padding: 10px 20px; }
    .nav-pills .nav-link.active { background-color: var(--primary) !important; color: white; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15); }

    .day-card { background: var(--card-bg); border: 1px solid #e2e8f0; border-radius: var(--radius-md); padding: 20px; height: 100%; transition: var(--transition); }
    .day-card:hover { transform: translateY(-3px); box-shadow: 0 12px 20px -8px rgba(0,0,0,0.05); border-color: #cbd5e1; }
    .lesson-box { background: var(--primary-light); padding: 14px; border-radius: 10px; margin-bottom: 12px; border-right: 4px solid var(--primary); font-size: 0.95rem; font-weight: 500; }

    .teacher-row {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid #e2e8f0;
      margin-bottom: 25px;
      padding: 20px;
    }
    
    .teacher-label-zone {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 8px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slots-grid-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .slot-card {
      position: relative;
      background: var(--bg-main);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      min-width: 220px;
      flex: 1;
      transition: var(--transition);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .slot-card:hover { background: #ffffff; border-color: var(--primary); transform: translateY(-1px); }
    
    .slot-header { 
      background: #e2e8f0; 
      font-size: 0.85rem; 
      padding: 8px 14px; 
      font-weight: 700; 
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .slot-content { font-size: 0.95rem; padding: 12px 14px; color: var(--text-main); font-weight: 600; flex-grow: 1; }
    .slot-combined-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .slot-room-inline { font-size: 0.85rem; color: var(--accent); font-weight: 700; }
    .slot-info-inline { font-size: 0.9rem; color: var(--text-main); }
    .slot-separator { color: #cbd5e1; margin: 0 2px; }

    .slot-card.active-slot {
      border: 2px solid var(--accent) !important;
      background-color: #f0fdfa !important;
    }
    .slot-card.active-slot .slot-header {
      background: #ccfbf1 !important;
      color: #115e59 !important;
    }
    .progress-bar-sand {
      position: absolute;
      bottom: 0;
      right: 0;            
      height: 5px;
      background-color: var(--accent);
      width: 0%;
      transition: width 1s linear;
    }

    .form-control { border: 1px solid #e2e8f0; background-color: #ffffff; padding: 12px 20px; transition: var(--transition); }
    
    .form-select { 
      border: 1px solid #e2e8f0; 
      background-color: #ffffff; 
      padding: 12px 20px;
      text-indent: 6px; 
      transition: var(--transition); 
    }
    .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.08); }
    
    .btn-primary { background-color: var(--primary); border: none; padding: 10px 24px; font-weight: 600; border-radius: 30px; transition: var(--transition); }
    .btn-primary:hover { background-color: #1e40af; transform: translateY(-1px); }

    .badge { font-size: 0.85rem; padding: 8px 14px; border-radius: 20px; cursor: pointer; transition: var(--transition); font-weight: 500; }
    .bg-custom-teacher { background-color: #f1f5f9 !important; color: var(--text-muted) !important; border: 1px solid #e2e8f0; }
    .bg-custom-teacher:hover { background-color: var(--primary-light) !important; color: var(--primary) !important; }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    
    .sticky-header-container {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      background: var(--card-bg);
      z-index: 1020;
      padding-bottom: 15px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .live-clock-badge {
      font-size: 1.1rem;
      font-weight: 700;
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 16px;
      border-radius: 30px;
      letter-spacing: 0.5px;
      font-family: monospace;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(30, 58, 138, 0.15);
    }

    /* כפתור לינק נקי אייקוני לשיתוף יום */
    .day-share-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 50%;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .day-share-icon-btn:hover {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    body.kiosk-mode {
      background-color: #ffffff !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    body.kiosk-mode #topNav, 
    body.kiosk-mode .no-print, 
    body.kiosk-mode .nav-pills,
    body.kiosk-mode .site-header-area {
      display: none !important;
    }
    body.kiosk-mode .main-container {
      max-width: 100% !important;
      width: 100vw !important;
      min-height: 100vh !important;
      margin: 0 !important;
      padding: 30px !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    body.kiosk-mode .sticky-header-container {
      background: #ffffff !important;
      padding-top: 15px;
    }
    body.kiosk-mode .teacher-row {
      margin-bottom: 30px !important;
      padding: 25px !important;
      background: #f8fafc;
    }
    body.kiosk-mode .slot-card {
      min-width: 260px !important;
    }
    body.kiosk-mode .slot-content {
      padding: 16px 14px !important;
    }

    body.teacher-view-mode #topNav,
    body.teacher-view-mode .site-header-area {
      display: none !important;
    }
    body.teacher-view-mode .main-container {
      margin-top: 20px !important;
      padding-top: 20px !important;
    }

    body:not(.kiosk-mode) .teacher-row {
      margin-bottom: 10px !important;
      padding: 10px 14px !important;
    }
    body:not(.kiosk-mode) .teacher-label-zone {
      font-size: 0.95rem !important;
      margin-bottom: 6px !important;
      padding-bottom: 4px !important;
    }
    body:not(.kiosk-mode) .slots-grid-container {
      gap: 6px !important;
    }
    body:not(.kiosk-mode) .slot-card {
      min-width: 180px !important;
    }
    body:not(.kiosk-mode) .slot-header {
      padding: 3px 8px !important;
      font-size: 0.75rem !important;
    }
    body:not(.kiosk-mode) .slot-content {
      padding: 6px 8px !important;
    }
    body:not(.kiosk-mode) .slot-room-inline {
      font-size: 0.78rem !important;
    }
    body:not(.kiosk-mode) .slot-info-inline {
      font-size: 0.82rem !important;
    }

    @media (max-width: 768px) {
      .slot-card { min-width: 100%; width: 100%; }
    }
    @media print { .no-print { display: none !important; } .main-container { box-shadow: none; margin: 0; width: 100%; padding: 0; } }
  </style>
</head>
<body>

<div id="loader" class="loading-overlay">
  <div class="text-center">
    <div class="spinner-border text-primary" style="width: 2.5rem; height: 2.5rem; stroke-width: 3px;"></div>
    <p class="mt-3 fw-medium text-secondary">טוען נתונים מאובטחים...</p>
  </div>
</div>

<div id="authScreen" class="container" style="display: none;">
  <div class="auth-card text-center">
    <div class="bg-primary-light d-inline-flex p-3 rounded-circle mb-3"><i class="fa-solid fa-shield-halved text-primary fs-3"></i></div>
    <h5 class="fw-bold mb-1">מערכת קשר ולוחות זמנים</h5>
    <p class="text-muted small mb-4">אנא הזן סיסמת גישה להמשך</p>
    <div class="mb-3 text-start">
      <input type="password" id="accessPw" class="form-control rounded-3" placeholder="סיסמת כניסה" onkeydown="if(event.key === 'Enter') handleAuth()">
    </div>
    <button class="btn btn-primary w-100 rounded-3 py-2.5" onclick="handleAuth()">התחבר למערכת</button>
    <div id="authError" class="text-danger small mt-3 fw-semibold" style="display: none;">❌ סיסמה אינה נכונה</div>
  </div>
</div>

<div id="appScreen" class="main-container container" style="display: none;">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3 no-print site-header-area">
    <div class="d-flex align-items-center gap-2">
      <div class="bg-primary text-white p-2 rounded-3"><i class="fa-solid fa-graduation-cap"></i></div>
      <h5 class="fw-bold m-0 text-dark">קמפוס למידה דיגיטלי</h5>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="live-clock-badge">
        <i class="fa-regular fa-clock"></i>
        <span id="mainLiveClock">--:--:--</span>
      </div>
      <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>הדפסה</button>
    </div>
  </div>

  <ul class="nav nav-pills nav-justified mb-4 no-print" id="topNav">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-personal">👤 מבט תלמיד אישי</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-daily" onclick="drawDaily(currentActiveDayGlobal)">📅 לוח זמנים יומי</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-archive" onclick="applyFilters()">📊 ארכיון דיווחים</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-personal">
      <div id="adminSearchArea" class="mb-4 no-print">
        <input type="text" id="pSearch" class="form-control rounded-pill py-3 px-4 shadow-sm" placeholder="חפש תלמיד לקבלת מערכת שעות אישית והיסטוריה..." oninput="searchPersonal()">
      </div>
      
      <div id="shareArea" class="no-print text-center mb-4" style="display: none;">
        <div class="d-inline-flex flex-wrap align-items-center justify-content-center bg-light border rounded-pill py-2 px-4 shadow-sm gap-2">
          <span class="fw-bold text-secondary small"><i class="fa-solid fa-user-check text-success me-1"></i> התלמיד זוהה בהצלחה!</span>
          <button id="copyBtn" class="btn btn-sm btn-primary rounded-pill px-3 fw-bold" onclick="copyShareUrl()">
            <i class="fa-solid fa-link me-1"></i> העתק קישור מוגן לתלמיד
          </button>
        </div>
      </div>

      <div id="studentHeader" style="display:none;" class="text-center mb-4">
        <h4 class="fw-bold text-primary" id="studentNameDisplay"></h4>
      </div>
      
      <div id="pGrid" class="row row-cols-1 row-cols-md-5 g-3 mb-4"></div>
      
      <div id="adminReportsArea" style="display:none;" class="no-print border-top pt-4">
        <h6 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-clock-rotate-left me-1"></i>תיק דיווחים אישי קודם:</h6>
        <div class="row g-2 mb-3 bg-light p-2 rounded-3">
          <div class="col-6"><select id="pMonth" class="form-select border-0 shadow-sm" onchange="filterPersonalReports()"><option value="ALL">כל החודשים</option></select></div>
          <div class="col-6"><select id="pTeacher" class="form-select border-0 shadow-sm" onchange="filterPersonalReports()"><option value="ALL">כל המורים</option></select></div>
        </div>
        <div id="pSummary" class="d-flex flex-wrap gap-1 mb-3"></div>
        <div id="pReportsList" class="overflow-auto border rounded-3 bg-white" style="max-height: 400px;"></div>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-daily">
      <div id="dailyContent" class="p-2"></div>
    </div>

    <div class="tab-pane fade" id="tab-archive">
      <div class="row g-2 mb-4 bg-light p-3 rounded-4 no-print">
        <div class="col-md-4"><select id="fMonth" class="form-select border-0 shadow-sm" onchange="applyFilters()"><option value="ALL">כל החודשים</option></select></div>
        <div class="col-md-4"><select id="fTeacher" class="form-select border-0 shadow-sm" onchange="applyFilters()"><option value="ALL">כל המורים</option></select></div>
        <div class="col-md-4"><input type="text" id="fSearch" class="form-control border-0 shadow-sm" placeholder="חיפוש חופשי בתוכן הדיווח..." onkeyup="applyFilters()"></div>
      </div>
      <div id="fSummary" class="d-flex flex-wrap gap-1 mb-3 no-print"></div>
      <div id="archiveContent" class="overflow-auto border rounded-3 bg-white" style="max-height: 500px;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let GLOBAL_DB = null;
  let lastSearchResults = [];
  let isStudentMode = false;
  let isTeacherMode = false;
  let identifiedStudent = "";
  let currentActiveDayGlobal = "ראשון";

  window.onload = async () => {
    try {
      const response = await fetch('data.json');
      GLOBAL_DB = await response.json();
      
      const urlParams = new URLSearchParams(window.location.search);
      const urlPw = urlParams.get('pw') || "";
      const urlId = urlParams.get('id') || "";
      const urlDay = urlParams.get('day') || "";

      document.getElementById('loader').style.display = 'none';

      const validDays = ["ראשון", "שני", "שלישי", "רביעי", "חמישי"];
      if (urlDay && validDays.includes(urlDay)) {
        currentActiveDayGlobal = urlDay;
      }

      if (urlDay && validDays.includes(urlDay)) {
        isTeacherMode = true;
        document.body.classList.add('teacher-view-mode');
        startApp();
      } 
      else if (urlPw === GLOBAL_DB.studentPw && urlId && GLOBAL_DB.studentsMapping[urlId]) {
        isStudentMode = true;
        identifiedStudent = GLOBAL_DB.studentsMapping[urlId];
        startApp();
      } 
      else {
        document.getElementById('authScreen').style.display = 'block';
      }

      setInterval(updateLiveClock, 1000);
    } catch (err) {
      console.error(err);
      alert("שגיאה בחיבור לבסיס הנתונים.");
    }
  };

  function updateLiveClock() {
    const now = new Date();
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const secs = String(now.getSeconds()).padStart(2, '0');
    const timeString = `${hrs}:${mins}:${secs}`;

    const mainClock = document.getElementById('mainLiveClock');
    if (mainClock) mainClock.textContent = timeString;

    const kioskClock = document.getElementById('kioskLiveClock');
    if (kioskClock) kioskClock.textContent = timeString;
  }

  function handleAuth() {
    const inputPw = document.getElementById('accessPw').value.trim();
    if (inputPw === GLOBAL_DB.adminPw) {
      isStudentMode = false;
      isTeacherMode = false;
      document.body.classList.remove('teacher-view-mode');
      document.getElementById('authScreen').style.display = 'none';
      startApp();
    } else {
      document.getElementById('authError').style.display = 'block';
    }
  }

  function startApp() {
    document.getElementById('appScreen').style.display = 'block';
    if (GLOBAL_DB.availableMonths) {
      ['fMonth', 'pMonth'].forEach(id => {
        const el = document.getElementById(id);
        GLOBAL_DB.availableMonths.forEach(m => el.innerHTML += `<option value="${m}">${m}</option>`);
      });
    }
    if (GLOBAL_DB.availableTeachers) {
      ['fTeacher', 'pTeacher'].forEach(id => {
        const el = document.getElementById(id);
        GLOBAL_DB.availableTeachers.forEach(t => el.innerHTML += `<option value="${t}">${t}</option>`);
      });
    }
    
    if (isTeacherMode) {
      const dailyTriggerBtn = document.querySelector('[data-bs-target="#tab-daily"]');
      if (dailyTriggerBtn) {
        dailyTriggerBtn.click(); 
        return;
      }
    }

    if (isStudentMode) {
      const pInput = document.getElementById('pSearch');
      pInput.value = identifiedStudent;
      pInput.readOnly = true; 
      document.getElementById('adminSearchArea').style.display = 'none';
      document.getElementById('topNav').style.display = 'none';
      document.getElementById('studentHeader').style.display = 'block';
      document.getElementById('studentNameDisplay').innerHTML = `<i class="fa-solid fa-user-graduate me-2"></i>מערכת שעות אישית: ${identifiedStudent}`;
      if(document.getElementById('shareArea')) document.getElementById('shareArea').remove();
      if(document.getElementById('adminReportsArea')) document.getElementById('adminReportsArea').remove();
      searchPersonal(true); 
    }
  }

  function searchPersonal(studentMode = false) {
    const q = document.getElementById('pSearch').value.trim().toLowerCase();
    const grid = document.getElementById('pGrid');
    if (q.length < 2) { grid.innerHTML = ""; return; }
    
    let html = '';
    ["ראשון", "שני", "שלישי", "רביעי", "חמישי"].forEach(day => {
      let lessons = '';
      if (GLOBAL_DB.schedule[day]) {
        GLOBAL_DB.schedule[day].forEach(row => {
          for (let i = 2; i < row.length; i++) {
            if (row[i].toLowerCase().includes(q)) {
              lessons += `<div class="lesson-box"><b>${row[1]}</b><br>${row[i]}</div>`;
            }
          }
        });
      }
      html += `<div class="col"><div class="day-card"><h6 class="text-center border-bottom pb-2 mb-3 fw-bold text-primary">יום ${day}</h6>${lessons || '<div class="text-center text-muted small py-3">אין שעות רשומות</div>'}</div></div>`;
    });
    grid.innerHTML = html;

    if (!studentMode) {
       document.getElementById('adminReportsArea').style.display = 'block';
       filterPersonalReports();
       document.getElementById('shareArea').style.display = 'block';
    }
  }

  function copyShareUrl() {
    const studentName = document.getElementById('pSearch').value.trim();
    const copyBtn = document.getElementById('copyBtn');
    let foundToken = null;
    for (let token in GLOBAL_DB.studentsMapping) {
      if (GLOBAL_DB.studentsMapping[token].toLowerCase() === studentName.toLowerCase()) { foundToken = token; break; }
    }
    if (!foundToken) { alert("לא נמצא מפתח אישי לתלמיד זה."); return; }
    const finalUrl = `${window.location.href.split('?')[0]}?pw=${GLOBAL_DB.studentPw}&id=${foundToken}`;
    navigator.clipboard.writeText(finalUrl);
    copyBtn.innerHTML = "✅ הקישור הועתק!";
    setTimeout(() => copyBtn.innerHTML = '<i class="fa-solid fa-link me-1"></i> העתק קישור מוגן לתלמיד', 2500);
  }

  // פונקציית העתקה משודרגת עם שינוי זמני של האייקון למתן פידבק מהיר
  function copyDayUrl(dayName) {
    const iconEl = document.getElementById('shareIconObj');
    const baseUrl = window.location.href.split('?')[0];
    const finalUrl = `${baseUrl}?day=${dayName}`;
    navigator.clipboard.writeText(finalUrl);
    
    if (iconEl) {
      iconEl.className = "fa-solid fa-check text-success";
      setTimeout(() => {
        iconEl.className = "fa-solid fa-link text-muted";
      }, 2000);
    }
  }

  function parseTimeToDecimal(timeStr) {
    const parts = timeStr.trim().split(':');
    if (parts.length < 2) return 0;
    return parseInt(parts[0], 10) + (parseInt(parts[1], 10) / 60);
  }

  function drawDaily(activeDay) {
    currentActiveDayGlobal = activeDay;
    const days = ["ראשון", "שני", "שלישי", "רביעי", "חמישי"];
    
    let tabsHtml = `<div class="sticky-header-container">`;
    tabsHtml += `<div class="d-flex justify-content-center gap-2 mb-3 no-print">`;
    days.forEach(day => {
      const activeClass = (day === activeDay) ? 'btn-primary' : 'btn-outline-primary';
      tabsHtml += `<button class="btn btn-sm ${activeClass} rounded-pill px-4 py-2 fw-bold" onclick="drawDaily('${day}')">יום ${day}</button>`;
    });
    tabsHtml += `</div>`;

    let isKiosk = document.body.classList.contains('kiosk-mode');
    
    if (isKiosk) {
      tabsHtml += `
        <div class="d-flex justify-content-between align-items-center mt-3 px-2">
          <div style="flex: 1;" class="text-end">
            <button class="btn btn-sm btn-danger rounded-pill px-3 py-1.5 fw-bold" 
                    style="font-size: 0.85rem;" 
                    onclick="toggleKioskMode('${activeDay}')">
              <i class="fa-solid fa-compress me-1"></i> יציאה ממסך מלא
            </button>
          </div>
          <div class="d-flex align-items-center justify-content-center gap-3">
            <h5 class="fw-bold m-0 text-dark">
              לוח זמנים מפורט - יום ${activeDay}
            </h5>
            <div class="live-clock-badge">
              <i class="fa-regular fa-clock"></i>
              <span id="kioskLiveClock">--:--:--</span>
            </div>
          </div>
          <div style="flex: 1;"></div>
        </div>`;
    } else {
      // כאן הוחלף הכפתור הירוק הגדול באייקון שרשרת (Link) קטן ונקי צמוד לכותרת
      tabsHtml += `
        <div class="d-flex justify-content-center align-items-center flex-wrap gap-3 mt-3 px-2">
          <h5 class="fw-bold m-0 text-dark d-flex align-items-center gap-2">
            מערכת שעות - יום ${activeDay}
            <button class="day-share-icon-btn no-print" title="העתק קישור ליום זה" onclick="copyDayUrl('${activeDay}')">
              <i id="shareIconObj" class="fa-solid fa-link text-muted"></i>
            </button>
          </h5>
          <button class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1.5 fw-bold ms-auto ms-sm-0" 
                  style="font-size: 0.85rem;" 
                  onclick="toggleKioskMode('${activeDay}')">
            <i class="fa-solid fa-expand me-1"></i> מצב מסך מלא
          </button>
        </div>`;
    }
    
    tabsHtml += `</div>`;

    let contentHtml = `<div class="daily-rows-scroll-area">`;
    const rows = GLOBAL_DB.schedule[activeDay] || [];
    
    if (rows.length > 1) {
      const headers = rows[0]; 
      let globalHours = {};    

      const now = new Date();
      const currentTimeDecimal = now.getHours() + (now.getMinutes() / 60);

      for (let j = 2; j < headers.length; j++) {
        let uniqueContents = new Set();
        let countRowsWithData = 0;

        rows.slice(1).forEach(row => {
          let cell = (row[j] || "").trim();
          if (cell) {
            countRowsWithData++;
            const parts = cell.split('-');
            let cleanText = parts.length > 1 ? parts.slice(1).join('-').trim() : parts[0].trim();
            if (cleanText) uniqueContents.add(cleanText);
          }
        });

        if (uniqueContents.size === 1 && countRowsWithData >= 2) {
          globalHours[j] = Array.from(uniqueContents)[0]; 
        }
      }

      rows.slice(1).forEach(row => {
        let teacherInfo = row[1]; 
        let hasDataInRow = false;
        let slotsHtml = "";

        for (let j = 2; j < headers.length; j++) {
          if (row[j] && row[j].trim()) {
            hasDataInRow = true;

            let isActiveSlot = false;
            let progressPercentage = 0;
            const timeRangeString = headers[j];

            if (timeRangeString && timeRangeString.includes('-')) {
              const [startStr, endStr] = timeRangeString.split('-');
              const startDecimal = parseTimeToDecimal(startStr);
              const endDecimal = parseTimeToDecimal(endStr);
              if (currentTimeDecimal >= startDecimal && currentTimeDecimal < endDecimal) {
                isActiveSlot = true;
                const totalDuration = endDecimal - startDecimal;
                const elapsed = currentTimeDecimal - startDecimal;
                progressPercentage = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
              }
            }

            const activeClassHtml = isActiveSlot ? 'active-slot' : '';
            const sandBarHtml = isActiveSlot ? `<div class="progress-bar-sand" style="width: ${progressPercentage}%"></div>` : '';
            
            if (globalHours[j]) {
              slotsHtml += `
                <div class="slot-card shadow-sm ${activeClassHtml}">
                  <div class="slot-header">
                    <span><i class="fa-regular fa-clock me-1"></i>${headers[j]}</span>
                  </div>
                  <div class="slot-content text-center text-success fw-bold">${globalHours[j]}</div>
                  ${sandBarHtml}
                </div>`;
            } else {
              const parts = row[j].split('-');
              let subjectOrRoom = parts.length > 1 ? parts[0].trim() : "";
              let info = parts.length > 1 ? parts.slice(1).join('-').trim() : parts[0].trim();

              slotsHtml += `
                <div class="slot-card shadow-sm ${activeClassHtml}">
                  <div class="slot-header">
                    <span><i class="fa-regular fa-clock me-1"></i>${headers[j]}</span>
                  </div>
                  <div class="slot-content">
                    <div class="slot-combined-line">
                      ${subjectOrRoom ? `<span class="slot-room-inline"><i class="fa-solid fa-tag me-1"></i>${subjectOrRoom}</span><span class="slot-separator">|</span>` : ''}
                      <span class="slot-info-inline">${info}</span>
                    </div>
                  </div>
                  ${sandBarHtml}
                </div>`;
            }
          }
        }

        if (hasDataInRow) {
          contentHtml += `
            <div class="teacher-row shadow-sm">
              <div class="teacher-label-zone">
                <i class="fa-solid fa-id-card text-primary"></i> ${teacherInfo}
              </div>
              <div class="slots-grid-container">
                ${slotsHtml}
              </div>
            </div>`;
        }
      });

    } else {
      contentHtml += `<p class="text-center text-muted py-5">אין נתונים להצגה ליום ${activeDay}</p>`;
    }
    contentHtml += `</div>`;
    
    document.getElementById('dailyContent').innerHTML = tabsHtml + contentHtml;
    updateLiveClock(); 
  }

  function toggleKioskMode(activeDay) {
    const isActivating = !document.body.classList.contains('kiosk-mode');
    document.body.classList.toggle('kiosk-mode');
    
    if (isActivating) {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => console.log("Fullscreen error:", err));
      }
    } else {
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(err => console.log("Fullscreen exit error:", err));
      }
    }
    drawDaily(activeDay);
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      document.body.classList.remove('kiosk-mode');
      if (isTeacherMode) {
        document.body.classList.add('teacher-view-mode');
      }
      drawDaily(currentActiveDayGlobal);
    }
  });

  setInterval(() => {
    const dailyTab = document.getElementById('tab-daily');
    if (dailyTab && dailyTab.classList.contains('active') && dailyTab.style.display !== 'none') {
      drawDaily(currentActiveDayGlobal);
    }
  }, 30000);

  function renderSummary(reports, containerId) {
    const container = document.getElementById(containerId);
    if (!reports || reports.length === 0) { container.innerHTML = ""; return; }
    const stats = { total: reports.length, teachers: {} };
    reports.forEach(r => { stats.teachers[r.teacher] = (stats.teachers[r.teacher] || 0) + 1; });

    let html = `<span class="badge bg-primary me-2 mb-2 shadow-sm" onclick="filterByTeacherBubble('ALL', '${containerId}')">כל הדיווחים (${stats.total})</span>`;
    Object.keys(stats.teachers).sort().forEach(t => {
      html += `<span class="badge bg-custom-teacher me-2 mb-2 shadow-sm" onclick="filterByTeacherBubble('${t}', '${containerId}')">${t} (${stats.teachers[t]})</span>`;
    });
    container.innerHTML = html;
  }

  function filterByTeacherBubble(teacherName, containerId) {
    const isPersonal = (containerId === 'pSummary');
    document.getElementById(isPersonal ? 'pTeacher' : 'fTeacher').value = teacherName;
    const filtered = (teacherName === 'ALL') ? lastSearchResults : lastSearchResults.filter(r => r.teacher === teacherName);
    displayReportList(filtered, isPersonal ? 'pReportsList' : 'archiveContent');
  }

  function displayReportList(reports, listId) {
    const list = document.getElementById(listId);
    if (reports.length > 0) {
      list.innerHTML = reports.map(r => `
        <div class="report-item p-3 border-bottom">
          <div class="d-flex justify-content-between small mb-2">
            <span class="fw-bold text-primary" style="font-size:1rem">${r.teacher} | תלמיד: ${r.studentName}</span>
            <span class="text-muted"><i class="fa-regular fa-clock me-1"></i>${r.timestamp}</span>
          </div>
          <div class="text-dark bg-light p-2.5 rounded-2" style="font-size:0.95rem;">${r.content}</div>
        </div>
      `).join('');
    } else {
      list.innerHTML = `<p class="text-center p-4 text-muted">אין דיווחים מתאימים בנמצא.</p>`;
    }
  }

  function filterPersonalReports() {
    const q = document.getElementById('pSearch').value.trim().toLowerCase();
    const m = document.getElementById('pMonth').value;
    const t = document.getElementById('pTeacher').value;
    lastSearchResults = GLOBAL_DB.reports.filter(r => r.allText.includes(q) && (m === "ALL" || r.month === m));
    renderSummary(lastSearchResults, 'pSummary');
    const finalFiltered = (t === "ALL") ? lastSearchResults : lastSearchResults.filter(r => r.teacher === t);
    displayReportList(finalFiltered, 'pReportsList');
  }

  function applyFilters() {
    const m = document.getElementById('fMonth').value;
    const t = document.getElementById('fTeacher').value;
    const s = document.getElementById('fSearch').value.toLowerCase();
    lastSearchResults = GLOBAL_DB.reports.filter(r => (m === "ALL" || r.month === m) && r.allText.includes(s));
    renderSummary(lastSearchResults, 'fSummary');
    const finalFiltered = (t === "ALL") ? lastSearchResults : lastSearchResults.filter(r => r.teacher === t);
    displayReportList(finalFiltered, 'archiveContent');
  }
</script>
</body>
</html>
