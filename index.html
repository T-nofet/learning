<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>קמפוס למידה - מסך קיוסק</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --primary: #1e3a8a; --accent: #0d9488; }
    body { background: #f8fafc; font-family: 'Assistant', sans-serif; }
    .main-container { max-width: 1100px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 20px; }
    
    /* מצב קיוסק */
    body.kiosk-mode { padding: 0 !important; }
    body.kiosk-mode .no-print { display: none !important; }
    body.kiosk-mode .main-container { max-width: 100% !important; margin: 0 !important; border-radius: 0 !important; }
    
    /* ציר זמן אנכי */
    #timeline-indicator { display: none; position: fixed; right: 20px; top: 100px; height: 70vh; width: 4px; background: #e2e8f0; z-index: 1000; }
    #time-pointer { position: absolute; right: -8px; width: 20px; height: 20px; background: #ef4444; border-radius: 50%; transition: top 1s linear; }
    body.kiosk-mode #timeline-indicator { display: block; }

    .current-slot { border: 3px solid var(--accent) !important; background-color: #f0fdfa !important; }
    .teacher-row { margin-bottom: 20px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 12px; }
    .slots-grid-container { display: flex; gap: 10px; flex-wrap: wrap; }
    .slot-card { background: #f1f5f9; padding: 10px; border-radius: 8px; flex: 1; min-width: 150px; }
  </style>
</head>
<body>

<div id="timeline-indicator"><div id="time-pointer"></div></div>

<div id="appScreen" class="main-container">
  <div class="no-print"><button class="btn btn-primary" onclick="toggleKioskMode()">מצב מסך מלא</button></div>
  <div id="dailyContent"></div>
</div>

<script>
  let GLOBAL_DB = null;
  const START_HOUR = 8, END_HOUR = 16; // הגדרת שעות יום הלימודים

  window.onload = async () => {
    const res = await fetch('data.json');
    GLOBAL_DB = await res.json();
    drawDaily('ראשון');
    setInterval(refreshView, 60000);
  };

  function drawDaily(day) {
    const now = new Date();
    const currentHour = now.getHours() + (now.getMinutes() / 60);
    const rows = GLOBAL_DB.schedule[day] || [];
    let html = `<h3>לו"ז יום ${day}</h3>`;
    
    rows.slice(1).forEach(row => {
      html += `<div class="teacher-row"><h5>${row[1]}</h5><div class="slots-grid-container">`;
      rows[0].slice(2).forEach((header, idx) => {
        const [start, end] = header.split('-').map(t => t.split(':').reduce((h, m) => parseInt(h) + parseInt(m)/60));
        const isCurrent = (currentHour >= start && currentHour < end);
        html += `<div class="slot-card ${isCurrent ? 'current-slot' : ''}">${row[idx+2] || ''}</div>`;
      });
      html += `</div></div>`;
    });
    document.getElementById('dailyContent').innerHTML = html;
    updateTimeline();
  }

  function updateTimeline() {
    const now = new Date();
    const time = now.getHours() + (now.getMinutes() / 60);
    const percentage = ((time - START_HOUR) / (END_HOUR - START_HOUR)) * 100;
    const pointer = document.getElementById('time-pointer');
    if(pointer) pointer.style.top = Math.max(0, Math.min(100, percentage)) + "%";
    
    // גלילה אוטומטית לשיעור הנוכחי
    const active = document.querySelector('.current-slot');
    if(active && document.body.classList.contains('kiosk-mode')) {
      active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function toggleKioskMode() {
    document.body.classList.toggle('kiosk-mode');
    updateTimeline();
  }

  function refreshView() {
    const activeDay = 'ראשון'; // ניתן לשכלל ליום הנוכחי
    drawDaily(activeDay);
  }
</script>
</body>
</html>
