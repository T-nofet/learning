<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפוס למידה דיגיטלי</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #0d9488;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --radius-lg: 20px;
      --radius-md: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body { 
      background-color: var(--bg-main); 
      font-family: 'Assistant', sans-serif; 
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .main-container { 
      max-width: 1200px; 
      margin: 40px auto; 
      background: var(--card-bg); 
      padding: 30px; 
      border-radius: var(--radius-lg); 
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03); 
    }
    
    .auth-card {
      max-width: 400px;
      margin: 120px auto;
      background: var(--card-bg);
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .nav-pills { background: #f1f5f9; padding: 6px; border-radius: 30px; border: 1px solid #e2e8f0; }
    .nav-pills .nav-link { border-radius: 24px; color: var(--text-muted); font-weight: 600; transition: var(--transition); border: none; padding: 10px 20px; }
    .nav-pills .nav-link.active { background-color: var(--primary) !important; color: white; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15); }

    /* הבלוק העוטף של כל שעה במערכת היומית */
    .daily-hour-block {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      padding: 12px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 15px;
      transition: var(--transition);
    }

    .daily-hour-title {
      font-weight: 700;
      color: var(--primary);
      min-width: 110px;
      flex-shrink: 0;
      background: var(--primary-light);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.95rem;
    }

    .slots-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
      flex: 1;
    }

    .slot-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: center;
      position: relative;
      min-height: 48px;
      transition: var(--transition);
    }
    
    .slot-card:hover { border-color: var(--primary); transform: translateY(-1px); }

    .slot-header {
      width: 75px;
      min-width: 75px;
      padding: 6px 4px;
      background: #f1f5f9;
      border-left: 1px solid #e2e8f0;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .slot-content {
      padding: 4px 10px;
      display: flex;
      align-items: center;
      flex: 1;
    }

    .slot-combined-line {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .slot-room-inline {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--primary-light);
      padding: 1px 4px;
      border-radius: 4px;
    }

    .slot-info-inline {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .slot-countdown-bar {
      height: 3px;
      width: 0%;
      background-color: var(--accent);
      position: absolute;
      bottom: 0;
      left: 0;
      transition: width 1s linear;
    }

    /* ========================================================== */
    /* מצב מסך מלא (קיוסק) - מותאם להכנסת 4-5 שורות */
    /* ========================================================== */
    body.kiosk-mode { background-color: #ffffff !important; padding: 0 !important; }
    body.kiosk-mode #topNav, body.kiosk-mode .no-print, body.kiosk-mode .site-header-area { display: none !important; }
    
    body.kiosk-mode .main-container { 
      max-width: 100% !important; 
      width: 100vw !important; 
      height: 100vh !important; 
      margin: 0 !important; 
      padding: 10px 15px !important; 
      border-radius: 0 !important; 
      box-shadow: none !important;
      display: flex;
      flex-direction: column;
    }

    /* צמצום הכותרת העליונה בקיוסק */
    body.kiosk-mode .sticky-header-container { margin-bottom: 8px !important; padding-bottom: 5px !important; }

    body.kiosk-mode .daily-hour-block {
      margin-bottom: 8px !important;
      padding: 8px !important;
      min-height: 20vh; /* מבטיח שכל שורה תיקח כחמישית מהמסך */
    }

    body.kiosk-mode .daily-hour-title {
      min-width: 160px !important;
      font-size: 1.6rem !important;
      background: var(--primary) !important;
      color: white !important;
      height: 100% !important;
      border-radius: 12px !important;
    }

    body.kiosk-mode .slots-grid-container {
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
      gap: 10px !important;
    }

    body.kiosk-mode .slot-card {
      min-height: 80px !important;
      border-radius: 14px !important;
      border-width: 2px !important;
    }

    body.kiosk-mode .slot-header {
      width: 100px !important;
      min-width: 100px !important;
      font-size: 1rem !important;
      background: #cbd5e1 !important;
    }

    body.kiosk-mode .slot-info-inline { font-size: 1.2rem !important; font-weight: 800 !important; }
    body.kiosk-mode .slot-room-inline { font-size: 0.95rem !important; padding: 3px 8px !important; }

    /* הסתרת כפתור יציאה ממסך מלא למראה נקי יותר - הוא יופיע רק כשיזיזו עכבר או יגעו במסך (אופציונלי) */
    
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    
    .sticky-header-container {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      background: var(--card-bg);
      z-index: 1020;
      padding-bottom: 15px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .live-clock-badge {
      font-size: 1.1rem;
      font-weight: 700;
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 16px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(30, 58, 138, 0.15);
    }

    .day-share-icon-btn { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; padding: 4px 8px; cursor: pointer; border-radius: 50%; }

    @media (max-width: 768px) {
      .daily-hour-block { flex-direction: column; align-items: stretch; }
      .daily-hour-title { width: 100%; }
      .slots-grid-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="loader" class="loading-overlay">
  <div class="text-center">
    <div class="spinner-border text-primary" style="width: 2.5rem; height: 2.5rem;"></div>
    <p class="mt-3 fw-medium text-secondary">טוען נתונים מאובטחים...</p>
  </div>
</div>

<div id="authScreen" class="container" style="display: none;">
  <div class="auth-card text-center">
    <div class="bg-primary-light d-inline-flex p-3 rounded-circle mb-3"><i class="fa-solid fa-shield-halved text-primary fs-3"></i></div>
    <h5 class="fw-bold mb-1">מערכת קשר ולוחות זמנים</h5>
    <p class="text-muted small mb-4">אנא הזן סיסמת גישה להמשך</p>
    <div class="mb-3 text-start">
      <input type="password" id="accessPw" class="form-control rounded-3" placeholder="סיסמת כניסה" onkeydown="if(event.key === 'Enter') handleAuth()">
    </div>
    <button class="btn btn-primary w-100 rounded-3 py-2.5" onclick="handleAuth()">התחבר למערכת</button>
    <div id="authError" class="text-danger small mt-3 fw-semibold" style="display: none;">❌ סיסמה אינה נכונה</div>
  </div>
</div>

<div id="appScreen" class="main-container container" style="display: none;">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3 no-print site-header-area">
    <div class="d-flex align-items-center gap-2">
      <div class="bg-primary text-white p-2 rounded-3"><i class="fa-solid fa-graduation-cap"></i></div>
      <h5 class="fw-bold m-0 text-dark">קמפוס למידה דיגיטלי</h5>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="live-clock-badge">
        <i class="fa-regular fa-clock"></i>
        <span id="mainLiveClock">--:--:--</span>
      </div>
      <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>הדפסה</button>
    </div>
  </div>

  <ul class="nav nav-pills nav-justified mb-4 no-print" id="topNav">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-personal">👤 מבט תלמיד אישי</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-daily" onclick="drawDaily(currentActiveDayGlobal)">📅 לוח זמנים יומי</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-archive" onclick="applyFilters()">📊 ארכיון דיווחים</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-personal">
      <div id="adminSearchArea" class="mb-4 no-print">
        <input type="text" id="pSearch" class="form-control rounded-pill py-3 px-4 shadow-sm" placeholder="חפש תלמיד לקבלת מערכת שעות אישית והיסטוריה..." oninput="searchPersonal()">
      </div>
      <div id="studentHeader" style="display:none;" class="text-center mb-4">
        <h4 class="fw-bold text-primary" id="studentNameDisplay"></h4>
      </div>
      <div id="pGrid" class="row row-cols-1 row-cols-md-5 g-3 mb-4"></div>
    </div>

    <div class="tab-pane fade" id="tab-daily">
      <div id="dailyContent" class="p-2"></div>
    </div>

    <div class="tab-pane fade" id="tab-archive">
      <div class="row g-2 mb-4 bg-light p-3 rounded-4 no-print">
        <div class="col-md-4"><select id="fMonth" class="form-select border-0 shadow-sm" onchange="applyFilters()"><option value="ALL">כל החודשים</option></select></div>
        <div class="col-md-4"><select id="fTeacher" class="form-select border-0 shadow-sm" onchange="applyFilters()"><option value="ALL">כל המורים</option></select></div>
        <div class="col-md-4"><input type="text" id="fSearch" class="form-control border-0 shadow-sm" placeholder="חיפוש חופשי בתוכן הדיווח..." onkeyup="applyFilters()"></div>
      </div>
      <div id="archiveContent" class="overflow-auto border rounded-3 bg-white" style="max-height: 500px;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let GLOBAL_DB = null;
  let lastSearchResults = [];
  let isStudentMode = false;
  let isTeacherMode = false;
  let identifiedStudent = "";
  let currentActiveDayGlobal = "ראשון";

  window.onload = async () => {
    try {
      const response = await fetch('data.json');
      GLOBAL_DB = await response.json();
      const urlParams = new URLSearchParams(window.location.search);
      const urlPw = urlParams.get('pw') || "";
      const urlId = urlParams.get('id') || "";
      const urlDay = urlParams.get('day') || "";
      document.getElementById('loader').style.display = 'none';
      if (urlDay) currentActiveDayGlobal = urlDay;
      if (urlDay) { isTeacherMode = true; document.body.classList.add('teacher-view-mode'); startApp(); } 
      else if (urlPw === GLOBAL_DB.studentPw && urlId) { isStudentMode = true; identifiedStudent = GLOBAL_DB.studentsMapping[urlId]; startApp(); } 
      else { document.getElementById('authScreen').style.display = 'block'; }
      setInterval(updateLiveClock, 1000);
    } catch (err) { console.error(err); }
  };

  function updateLiveClock() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('he-IL');
    if (document.getElementById('mainLiveClock')) document.getElementById('mainLiveClock').textContent = timeString;
    if (document.getElementById('kioskLiveClock')) document.getElementById('kioskLiveClock').textContent = timeString;
  }

  function handleAuth() {
    const inputPw = document.getElementById('accessPw').value.trim();
    if (inputPw === GLOBAL_DB.adminPw) { document.getElementById('authScreen').style.display = 'none'; startApp(); }
    else { document.getElementById('authError').style.display = 'block'; }
  }

  function startApp() {
    document.getElementById('appScreen').style.display = 'block';
    if (isTeacherMode) document.querySelector('[data-bs-target="#tab-daily"]').click();
  }

  function searchPersonal() { /* לוגיקה קיימת */ }

  function parseTimeToDecimal(timeStr) {
    const parts = timeStr.trim().split(':');
    return parseInt(parts[0], 10) + (parseInt(parts[1], 10) / 60);
  }

  function drawDaily(activeDay) {
    currentActiveDayGlobal = activeDay;
    const days = ["ראשון", "שני", "שלישי", "רביעי", "חמישי"];
    let tabsHtml = `<div class="sticky-header-container">
      <div class="d-flex justify-content-center gap-2 mb-3 no-print">`;
    days.forEach(day => {
      const activeClass = (day === activeDay) ? 'btn-primary' : 'btn-outline-primary';
      tabsHtml += `<button class="btn btn-sm ${activeClass} rounded-pill px-4 py-2 fw-bold" onclick="drawDaily('${day}')">יום ${day}</button>`;
    });
    tabsHtml += `</div>`;

    if (document.body.classList.contains('kiosk-mode')) {
      tabsHtml += `
        <div class="d-flex justify-content-between align-items-center mt-2 px-2">
          <button class="btn btn-sm btn-danger rounded-pill px-3" onclick="toggleKioskMode('${activeDay}')">יציאה</button>
          <h5 class="fw-bold m-0">יום ${activeDay}</h5>
          <div class="live-clock-badge"><span id="kioskLiveClock">--:--:--</span></div>
        </div>`;
    } else {
      tabsHtml += `
        <div class="d-flex justify-content-center align-items-center gap-3 mt-2 px-2">
          <h5 class="fw-bold m-0">מערכת שעות - יום ${activeDay}</h5>
          <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="toggleKioskMode('${activeDay}')">מצב מסך מלא</button>
        </div>`;
    }
    tabsHtml += `</div>`;

    const rows = GLOBAL_DB.schedule[activeDay] || [];
    let contentHtml = "";
    if (rows.length > 1) {
      const headers = rows[0];
      const teachersRows = rows.slice(1);
      const now = new Date();
      const currentTimeDecimal = now.getHours() + (now.getMinutes() / 60);

      // זיהוי ארוחות/הפסקות
      const globalHours = {};
      for (let j = 2; j < headers.length; j++) {
        let unique = new Set();
        teachersRows.forEach(r => { if(r[j]) unique.add(r[j].trim()); });
        if (unique.size === 1) globalHours[j] = Array.from(unique)[0];
      }

      for (let j = 2; j < headers.length; j++) {
        const timeStr = headers[j];
        let hourSlotsHtml = "";
        let isHourActive = false;
        if (timeStr.includes('-')) {
          const [s, e] = timeStr.split('-');
          if (currentTimeDecimal >= parseTimeToDecimal(s) && currentTimeDecimal < parseTimeToDecimal(e)) isHourActive = true;
        }

        if (globalHours[j]) {
          hourSlotsHtml += `
            <div class="slot-card shadow-sm ${isHourActive ? 'active-hour-card' : ''}" style="grid-column: 1 / -1;">
              <div class="slot-header">${timeStr}</div>
              <div class="slot-content text-success fw-bold">${globalHours[j]}</div>
            </div>`;
        } else {
          teachersRows.forEach(row => {
            if (row[j]) {
              const parts = row[j].split('-');
              hourSlotsHtml += `
                <div class="slot-card shadow-sm ${isHourActive ? 'active-hour-card' : ''}">
                  <div class="slot-header">${row[1]}</div>
                  <div class="slot-content">
                    <div class="slot-combined-line">
                      ${parts.length > 1 ? `<span class="slot-room-inline">${parts[0].trim()}</span>` : ''}
                      <span class="slot-info-inline">${parts.length > 1 ? parts[1].trim() : parts[0].trim()}</span>
                    </div>
                  </div>
                </div>`;
            }
          });
        }

        if (hourSlotsHtml) {
          contentHtml += `
            <div class="daily-hour-block shadow-sm">
              <div class="daily-hour-title">${timeStr}</div>
              <div class="slots-grid-container">${hourSlotsHtml}</div>
            </div>`;
        }
      }
    }
    document.getElementById('dailyContent').innerHTML = tabsHtml + contentHtml;
  }

  function toggleKioskMode(activeDay) {
    document.body.classList.toggle('kiosk-mode');
    if (document.body.classList.contains('kiosk-mode')) document.documentElement.requestFullscreen();
    else if (document.fullscreenElement) document.exitFullscreen();
    drawDaily(activeDay);
  }

  function applyFilters() { /* לוגיקה קיימת */ }
</script>
</body>
</html>
