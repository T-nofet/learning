<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפוס למידה דיגיטלי</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ... כאן נמצאים כל ה-Styles המקוריים שלך ... */
    :root { --primary: #1e3a8a; --primary-light: #eff6ff; --accent: #0d9488; --bg-main: #f8fafc; --card-bg: #ffffff; }
    body { background-color: var(--bg-main); font-family: 'Assistant', sans-serif; }
    
    /* --- השינוי המוזרק: ניהול עיצוב מסך מלא ב-CSS בלבד --- */
    body.kiosk-mode { background-color: #ffffff !important; }
    body.kiosk-mode #topNav, body.kiosk-mode .no-print, body.kiosk-mode .site-header-area { display: none !important; }
    body.kiosk-mode .main-container { max-width: 100% !important; width: 100vw !important; margin: 0 !important; padding: 40px !important; border-radius: 0 !important; box-shadow: none !important; }
    body.kiosk-mode .slot-card { min-width: 280px !important; font-size: 1.2rem !important; }
  </style>
</head>
<body>

<div id="appScreen" class="main-container container">
  </div>

<script>
  /* ... כל ה-JS המקורי שלך (GLOBAL_DB, הפילטרים וכו') ... */
  
  // זה התיקון לפונקציה drawDaily שלך:
  function drawDaily(activeDay) {
    currentActiveDayGlobal = activeDay;
    const rows = GLOBAL_DB.schedule[activeDay] || [];
    
    let html = ``; // בנה את ה-HTML המקורי כפי שהיה
    
    rows.slice(1).forEach(row => {
      let slotsHtml = "";
      for (let j = 2; j < row.length; j++) {
        if (!row[j]) continue;
        
        // כאן הקסם: אנחנו בונים את ה-HTML תמיד אותו דבר
        slotsHtml += `<div class="slot-card">
                        <div class="slot-header">${GLOBAL_DB.schedule[0][j]}</div>
                        <div class="slot-content">${row[j]}</div>
                      </div>`;
      }
      
      html += `<div class="teacher-row">
                 <div class="teacher-label-zone">${row[1]}</div>
                 <div class="slots-grid-container">${slotsHtml}</div>
               </div>`;
    });
    document.getElementById('dailyContent').innerHTML = html;
  }

  // הפונקציה הזו מנהלת את מצב הקיוסק בלי לשנות את מבנה הנתונים
  function toggleKioskMode() {
    document.body.classList.toggle('kiosk-mode');
    drawDaily(currentActiveDayGlobal); 
  }
</script>
</body>
</html>
