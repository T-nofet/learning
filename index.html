<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>קמפוס למידה דיגיטלי</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --primary: #1e3a8a; --accent: #0d9488; --bg: #f8fafc; }
    body { background-color: var(--bg); font-family: 'Assistant', sans-serif; }
    .main-container { max-width: 1000px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    
    /* עיצוב המערכת המקורי */
    .teacher-row { background: #fff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .slot-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin-bottom: 10px; transition: 0.3s; }
    .current-slot { border: 3px solid var(--accent) !important; background-color: #f0fdfa !important; transform: scale(1.01); }

    /* עיצוב למסך מלא (Kiosk) */
    body.kiosk-mode { padding: 0 !important; }
    body.kiosk-mode .no-print { display: none !important; }
    body.kiosk-mode .main-container { max-width: 100% !important; margin: 0; border-radius: 0; min-height: 100vh; }

    /* ציר זמן אנכי למצב קיוסק */
    #timeline-container { display: none; position: fixed; right: 20px; top: 50px; height: 80vh; width: 4px; background: #e2e8f0; z-index: 1000; }
    #time-pointer { position: absolute; right: -8px; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; transition: top 0.5s linear; }
    body.kiosk-mode #timeline-container { display: block; }
  </style>
</head>
<body>

<div id="timeline-container"><div id="time-pointer"></div></div>

<div id="appScreen" class="main-container">
  <div class="d-flex justify-content-between align-items-center mb-4 no-print">
    <h4 class="fw-bold">לוח זמנים יומי</h4>
    <button class="btn btn-primary" onclick="toggleKiosk()">מצב מסך מלא</button>
  </div>
  <div id="dailyContent"></div>
</div>

<script>
  let GLOBAL_DB = null;
  const START_HOUR = 8, END_HOUR = 16;

  window.onload = async () => {
    const res = await fetch('data.json');
    GLOBAL_DB = await res.json();
    renderDay('ראשון');
    setInterval(() => renderDay('ראשון'), 60000);
  };

  function renderDay(day) {
    const now = new Date();
    const currentHour = now.getHours() + (now.getMinutes() / 60);
    const data = GLOBAL_DB.schedule[day] || [];
    let html = '';
    
    data.slice(1).forEach(row => {
      html += `<div class="teacher-row"><h5>${row[1]}</h5>`;
      data[0].slice(2).forEach((header, idx) => {
        const [start, end] = header.split('-').map(t => t.split(':').reduce((h, m) => parseInt(h) + parseInt(m)/60));
        const isCurrent = (currentHour >= start && currentHour < end);
        if (row[idx+2]) {
            html += `<div class="slot-card ${isCurrent ? 'current-slot' : ''}">${header}: ${row[idx+2]}</div>`;
        }
      });
      html += `</div>`;
    });
    document.getElementById('dailyContent').innerHTML = html;
    updatePointer();
  }

  function updatePointer() {
    const now = new Date();
    const time = now.getHours() + (now.getMinutes() / 60);
    const pct = ((time - START_HOUR) / (END_HOUR - START_HOUR)) * 100;
    document.getElementById('time-pointer').style.top = Math.max(0, Math.min(100, pct)) + "%";
    
    // גלילה אוטומטית לשיעור הנוכחי
    if(document.body.classList.contains('kiosk-mode')) {
      const active = document.querySelector('.current-slot');
      if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function toggleKiosk() {
    document.body.classList.toggle('kiosk-mode');
    updatePointer();
  }
</script>
</body>
</html>
