<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפוס למידה דיגיטלי</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0f172a;       /* כחול-נייבי פחם עמוק, חזק, יוקרתי וברור */
      --primary-light: #f1f5f9; /* רקע שורות נקי */
      --accent: #047857;        /* ירוק חזק, חי וברור יותר להדגשת השעה הנוכחית */
      --text-main: #000000;     /* שחור מוחלט לטקסט קריא בצורה מקסימלית */
      --text-muted: #334155;    /* אפור כהה מאוד למורים (לא עדין מדי) */
      --bg-main: #e2e8f0;       /* רקע כללי קצת יותר כהה הנותן קונטרסט מצוין לכרטיסיות הלבנות */
      --card-bg: #ffffff;
      --radius-lg: 14px;
      --radius-md: 8px;         /* פינות מהודקות יותר למראה קומפקטי */
      --transition: all 0.15s ease-in-out;
    }

    body { 
      background-color: var(--bg-main); 
      font-family: 'Assistant', sans-serif; 
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .main-container { 
      max-width: 1450px; 
      margin: 15px auto; 
      background: var(--card-bg); 
      padding: 16px;            /* צמצום פדינג כללי להצלת מקום */
      border-radius: var(--radius-lg); 
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06); 
    }
    
    .auth-card {
      max-width: 400px;
      margin: 120px auto;
      background: var(--card-bg);
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .nav-pills { background: #cbd5e1; padding: 4px; border-radius: 30px; border: none; }
    .nav-pills .nav-link { border-radius: 24px; color: #1e293b; font-weight: 700; transition: var(--transition); border: none; padding: 8px 16px; }
    .nav-pills .nav-link.active { background-color: var(--primary) !important; color: white; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); }

    .day-card { background: var(--card-bg); border: 1px solid #cbd5e1; border-radius: var(--radius-md); padding: 12px; height: 100%; transition: var(--transition); }
    .day-card:hover { border-color: #94a3b8; }
    .lesson-box { background: #f8fafc; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-right: 4px solid var(--primary); font-size: 0.95rem; font-weight: 600; border: 1px solid #cbd5e1; border-right-width: 4px; }

    /* שורת זמן ראשית - מסך רגיל (מהודק למניעת גלילה) */
    .time-block-row {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: stretch;
      gap: 8px;                 /* צמצום המרווחים בין הכרטיסיות */
      padding: 6px 12px;        /* צמצום הפדינג האנכי מ-10 ל-6 */
      margin-bottom: 8px;       /* צמצום המרווח בין השורות */
      transition: var(--transition);
    }
    
    .time-row-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;           /* טקסט לבן על רקע כהה לקריאות מירבית */
      background: var(--primary);
      min-width: 110px;
      max-width: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      flex-shrink: 0;
      gap: 4px;
    }

    .time-lessons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-grow: 1;
      align-items: center;
    }

    .lesson-slot-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 12px;
      min-width: 200px;
      max-width: 300px;
      flex-grow: 1;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .lesson-slot-card:hover { border-color: #94a3b8; background: #ffffff; }

    .slot-top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      font-size: 0.85rem;
    }
    .slot-teacher-text { color: var(--text-muted); font-weight: 700; }
    .slot-room-text { color: #ffffff; font-weight: 800; background: #0369a1; padding: 1px 8px; border-radius: 10px; font-size: 0.8rem; }

    .slot-main-info {
      color: var(--text-main);
      font-size: 1.02rem;
      font-weight: 700;
      white-space: normal; 
      overflow: visible;
      text-overflow: clip;
    }

    /* עיצוב שורה פעילה נוכחית - צבעים חזקים, ברורים ומודגשים מאוד */
    .time-block-row.active-time-row {
      border-color: var(--accent);
      border-width: 2px;
      background: #d1fae5;       /* רקע ירוק בהיר וחזק שלא יתפספס */
      box-shadow: 0 4px 12px rgba(4, 120, 87, 0.15);
    }
    .time-block-row.active-time-row .time-row-header {
      background: var(--accent);
      color: white;
    }
    .time-block-row.active-time-row .lesson-slot-card {
      background: #ffffff;
      border-color: var(--accent);
      border-width: 1.5px;
    }
    .time-block-row.active-time-row .slot-teacher-text {
      color: #047857;
    }

    .form-control { border: 1px solid #94a3b8; background-color: #ffffff; padding: 8px 12px; transition: var(--transition); border-radius: 6px; color: #000000; font-weight: 600; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
    
    /* תיקון פדינג, מרווחים ועיוות רינדור האות כ' בתפריטי בחירה (RTL) */
    .form-select { 
      border: 1px solid #94a3b8; 
      background-color: #ffffff; 
      padding: 8px 35px 8px 15px; 
      transition: var(--transition); 
      border-radius: 6px; 
      color: #000000;
      font-weight: 700;
      background-position: left 0.75rem center; 
    }
    .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
    
    .btn-primary { background-color: var(--primary); border: none; padding: 6px 20px; font-weight: 700; border-radius: 30px; transition: var(--transition); }
    .btn-primary:hover { background-color: #000000; }

    .badge { font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: var(--transition); font-weight: 700; }
    .bg-custom-teacher { background-color: #e2e8f0 !important; color: #0f172a !important; border: 1px solid #94a3b8; }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    
    .sticky-header-container {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      background: var(--card-bg);
      z-index: 1020;
      padding-bottom: 8px;
      border-bottom: 1px solid #cbd5e1;
      margin-bottom: 12px;
    }

    .live-clock-badge {
      font-size: 1rem;
      font-weight: 800;
      background-color: #f1f5f9;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #cbd5e1;
    }

    .day-share-icon-btn { background: none; border: none; color: #64748b; font-size: 1rem; padding: 4px; cursor: pointer; border-radius: 50%; }

    /* ==========================================
       התאמות דינמיות למצב מסך מלא (Kiosk Mode)
       ========================================== */
    body.kiosk-mode { background-color: #ffffff !important; padding: 0 !important; margin: 0 !important; overflow: hidden; }
    body.kiosk-mode #topNav, body.kiosk-mode .no-print, body.kiosk-mode .nav-pills, body.kiosk-mode .site-header-area { display: none !important; }
    
    body.kiosk-mode .main-container { 
      max-width: 100% !important; 
      width: 100vw !important; 
      height: 100vh !important; 
      margin: 0 !important; 
      padding: 16px !important; 
      border-radius: 0 !important; 
      box-shadow: none !important; 
      display: flex; 
      flex-direction: column; 
    }
    
    body.kiosk-mode .daily-rows-scroll-area { 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      overflow: hidden; 
      gap: 8px;
    }
    
    body.kiosk-mode .time-block-row { 
      padding: 6px 16px; 
      margin-bottom: 0px; 
      flex-grow: 1; 
      flex-shrink: 1;
      display: flex;
      align-items: center; 
      min-height: 0;
    }
    
    body.kiosk-mode .time-row-header { 
      font-size: 1.35rem; 
      min-width: 150px; 
      max-width: 150px; 
      padding: 8px; 
      height: 90%; 
    }
    
    body.kiosk-mode .time-lessons-container { 
      gap: 10px; 
      display: flex; 
      flex-wrap: nowrap; 
      overflow: hidden;
      height: 90%;
      align-items: center; 
    }
    
    body.kiosk-mode .lesson-slot-card { 
      min-width: 20%; 
      max-width: 32% !important; 
      flex-shrink: 1; 
      flex-grow: 1; 
      padding: 8px 14px;
      height: 100%;
      justify-content: center; 
    }
    
    body.kiosk-mode .slot-main-info { 
      font-size: calc(1rem + 0.25vw) !important; 
      white-space: normal !important;      
      overflow: visible !important;        
      text-overflow: clip !important;       
      display: -webkit-box !important;
      -webkit-line-clamp: 2 !important;     
      -webkit-box-orient: vertical !important;
      line-height: 1.2 !important;
    }
    
    body.kiosk-mode .slot-top-line { font-size: 0.95rem; margin-bottom: 2px; }

    body.teacher-view-mode #topNav, body.teacher-view-mode .site-header-area { display: none !important; }
    body.teacher-view-mode .main-container { margin-top: 10px !important; padding-top: 10px !important; }

    @media (max-width: 768px) {
      .time-block-row { flex-direction: column; align-items: stretch; gap: 6px; }
      .time-row-header { min-width: 100%; max-width: 100%; }
      .time-lessons-container { justify-content: center; }
      .lesson-slot-card { min-width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body>

<div id="loader" class="loading-overlay">
  <div class="text-center">
    <div class="spinner-border text-primary" style="width: 2.5rem; height: 2.5rem; stroke-width: 3px;"></div>
    <p class="mt-3 fw-medium text-secondary">טוען נתונים מאובטחים...</p>
  </div>
</div>

<div id="authScreen" class="container" style="display: none;">
  <div class="auth-card text-center">
    <div class="bg-primary-light d-inline-flex p-3 rounded-circle mb-3"><i class="fa-solid fa-shield-halved text-primary fs-3"></i></div>
    <h5 class="fw-bold mb-1">מערכת קשר ולוחות זמנים</h5>
    <p class="text-muted small mb-4">אנא הזן סיסמת גישה להמשך</p>
    <div class="mb-3 text-start">
      <input type="password" id="accessPw" class="form-control rounded-3" placeholder="סיסמת כניסה" onkeydown="if(event.key === 'Enter') handleAuth()">
    </div>
    <button class="btn btn-primary w-100 rounded-3 py-2.5" onclick="handleAuth()">התחבר למערכת</button>
    <div id="authError" class="text-danger small mt-3 fw-semibold" style="display: none;">❌ סיסמה אינה נכונה</div>
  </div>
</div>

<div id="appScreen" class="main-container container" style="display: none;">
  <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2 no-print site-header-area">
    <div class="d-flex align-items-center gap-2">
      <div class="bg-primary text-white p-2 rounded-3"><i class="fa-solid fa-graduation-cap"></i></div>
      <h5 class="fw-bold m-0 text-dark">קמפוס למידה דיגיטלי</h5>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="live-clock-badge">
        <i class="fa-regular fa-clock"></i>
        <span id="mainLiveClock">--:--:--</span>
      </div>
      <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>הדפסה</button>
    </div>
  </div>

  <ul class="nav nav-pills nav-justified mb-3 no-print" id="topNav">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-personal">👤 מבט תלמיד אישי</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-daily" onclick="drawDaily(currentActiveDayGlobal)">📅 לוח זמנים יומי</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-archive" onclick="applyFilters()">📊 ארכיון דיווחים</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-personal">
      <div id="adminSearchArea" class="mb-3 no-print">
        <input type="text" id="pSearch" class="form-control rounded-pill py-2 px-4 shadow-sm" placeholder="חפש תלמיד לקבלת מערכת שעות אישית והיסטוריה..." oninput="searchPersonal()">
      </div>
      
      <div id="shareArea" class="no-print text-center mb-3" style="display: none;">
        <div class="d-inline-flex flex-wrap align-items-center justify-content-center bg-light border rounded-pill py-2 px-4 shadow-sm gap-2">
          <span class="fw-bold text-secondary small"><i class="fa-solid fa-user-check text-success me-1"></i> התלמיד זוהה בהצלחה!</span>
          <button id="copyBtn" class="btn btn-sm btn-primary rounded-pill px-3 fw-bold" onclick="copyShareUrl()">
            <i class="fa-solid fa-link me-1"></i> העתק קישור מוגן לתלמיד
          </button>
        </div>
      </div>

      <div id="studentHeader" style="display:none;" class="text-center mb-3">
        <h4 class="fw-bold text-primary" id="studentNameDisplay"></h4>
      </div>
      
      <div id="pGrid" class="row row-cols-1 row-cols-md-5 g-2 mb-3"></div>
      
      <div id="adminReportsArea" style="display:none;" class="no-print border-top pt-3">
        <h6 class="fw-bold text-secondary mb-2"><i class="fa-solid fa-clock-rotate-left me-1"></i>תיק דיווחים אישי קודם:</h6>
        <div class="row g-2 mb-2 bg-light p-2 rounded-3">
          <div class="col-6"><select id="pMonth" class="form-select border-0 shadow-sm" onchange="filterPersonalReports()"><option value="ALL">כל החודשים</option></select></div>
          <div class="col-6"><select id="pTeacher" class="form-select border-0 shadow-sm" onchange="filterPersonalReports()"><option value="ALL">כל המורים</option></select></div>
        </div>
        <div id="pSummary" class="d-flex flex-wrap gap-1 mb-2"></div>
        <div id="pReportsList" class="overflow-auto border rounded-3 bg-white" style="max-height: 350px;"></div>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-daily">
      <div id="dailyContent" class="p-1"></div>
    </div>

    <div class="tab-pane fade" id="tab-archive">
      <div class="row g-2 mb-3 bg-light p-2 rounded-3 no-print">
        <div class="col-md-4"><select id="fMonth" class="form-select border-0 shadow-sm" onchange="applyFilters()"><option value="ALL">כל החודשים</option></select></div>
        <div class="col-md-4"><select id="fTeacher" class="form-select border-0 shadow-sm" onchange="applyFilters()"><option value="ALL">כל המורים</option></select></div>
        <div class="col-md-4"><input type="text" id="fSearch" class="form-control border-0 shadow-sm" placeholder="חיפוש חופשי בתוכן הדיווח..." onkeyup="applyFilters()"></div>
      </div>
      <div id="fSummary" class="d-flex flex-wrap gap-1 mb-2 no-print"></div>
      <div id="archiveContent" class="overflow-auto border rounded-3 bg-white" style="max-height: 450px;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let GLOBAL_DB = null;
  let lastSearchResults = [];
  let isStudentMode = false;
  let isTeacherMode = false;
  let identifiedStudent = "";
  let currentActiveDayGlobal = "ראשון";

  window.onload = async () => {
    try {
      const response = await fetch('data.json');
      GLOBAL_DB = await response.json();
      
      const urlParams = new URLSearchParams(window.location.search);
      const urlPw = urlParams.get('pw') || "";
      const urlId = urlParams.get('id') || "";
      const urlDay = urlParams.get('day') || "";

      document.getElementById('loader').style.display = 'none';

      const validDays = ["ראשון", "שני", "שלישי", "רביעי", "חמישי"];
      if (urlDay && validDays.includes(urlDay)) {
        currentActiveDayGlobal = urlDay;
      }

      if (urlDay && validDays.includes(urlDay)) {
        isTeacherMode = true;
        document.body.classList.add('teacher-view-mode');
        startApp();
      } 
      else if (urlPw === GLOBAL_DB.studentPw && urlId && GLOBAL_DB.studentsMapping[urlId]) {
        isStudentMode = true;
        identifiedStudent = GLOBAL_DB.studentsMapping[urlId];
        startApp();
      } 
      else {
        document.getElementById('authScreen').style.display = 'block';
      }

      setInterval(updateLiveClock, 1000);
    } catch (err) {
      console.error(err);
      alert("שגיאה בחיבור לבסיס הנתונים.");
    }
  };

  function updateLiveClock() {
    const now = new Date();
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const secs = String(now.getSeconds()).padStart(2, '0');
    const timeString = `${hrs}:${mins}:${secs}`;

    const mainClock = document.getElementById('mainLiveClock');
    if (mainClock) mainClock.textContent = timeString;

    const kioskClock = document.getElementById('kioskLiveClock');
    if (kioskClock) kioskClock.textContent = timeString;
  }

  function handleAuth() {
    const inputPw = document.getElementById('accessPw').value.trim();
    if (inputPw === GLOBAL_DB.adminPw) {
      isStudentMode = false;
      isTeacherMode = false;
      document.body.classList.remove('teacher-view-mode');
      document.getElementById('authScreen').style.display = 'none';
      startApp();
    } else {
      document.getElementById('authError').style.display = 'block';
    }
  }

  function startApp() {
    document.getElementById('appScreen').style.display = 'block';
    if (GLOBAL_DB.availableMonths) {
      ['fMonth', 'pMonth'].forEach(id => {
        const el = document.getElementById(id);
        GLOBAL_DB.availableMonths.forEach(m => el.innerHTML += `<option value="${m}">${m}</option>`);
      });
    }
    if (GLOBAL_DB.availableTeachers) {
      ['fTeacher', 'pTeacher'].forEach(id => {
        const el = document.getElementById(id);
        GLOBAL_DB.availableTeachers.forEach(t => el.innerHTML += `<option value="${t}">${t}</option>`);
      });
    }
    
    if (isTeacherMode) {
      const dailyTriggerBtn = document.querySelector('[data-bs-target="#tab-daily"]');
      if (dailyTriggerBtn) {
        dailyTriggerBtn.click(); 
        return;
      }
    }

    if (isStudentMode) {
      const pInput = document.getElementById('pSearch');
      pInput.value = identifiedStudent;
      pInput.readOnly = true; 
      document.getElementById('adminSearchArea').style.display = 'none';
      document.getElementById('topNav').style.display = 'none';
      document.getElementById('studentHeader').style.display = 'block';
      document.getElementById('studentNameDisplay').innerHTML = `<i class="fa-solid fa-user-graduate me-2"></i>מערכת שעות אישית: ${identifiedStudent}`;
      if(document.getElementById('shareArea')) document.getElementById('shareArea').remove();
      if(document.getElementById('adminReportsArea')) document.getElementById('adminReportsArea').remove();
      searchPersonal(true); 
    }
  }

  function searchPersonal(studentMode = false) {
    const q = document.getElementById('pSearch').value.trim().toLowerCase();
    const grid = document.getElementById('pGrid');
    if (q.length < 2) { grid.innerHTML = ""; return; }
    
    let html = '';
    ["ראשון", "שני", "שלישי", "רביעי", "חמישי"].forEach(day => {
      let lessons = '';
      if (GLOBAL_DB.schedule[day]) {
        GLOBAL_DB.schedule[day].forEach(row => {
          for (let i = 2; i < row.length; i++) {
            if (row[i].toLowerCase().includes(q)) {
              lessons += `<div class="lesson-box"><b>${row[1]}</b><br>${row[i]}</div>`;
            }
          }
        });
      }
      html += `<div class="col"><div class="day-card"><h6 class="text-center border-bottom pb-1 mb-2 fw-bold text-primary">יום ${day}</h6>${lessons || '<div class="text-center text-muted small py-2">אין שעות רשומות</div>'}</div></div>`;
    });
    grid.innerHTML = html;

    if (!studentMode) {
       document.getElementById('adminReportsArea').style.display = 'block';
       filterPersonalReports();
       document.getElementById('shareArea').style.display = 'block';
    }
  }

  function copyShareUrl() {
    const studentName = document.getElementById('pSearch').value.trim();
    const copyBtn = document.getElementById('copyBtn');
    let foundToken = null;
    for (let token in GLOBAL_DB.studentsMapping) {
      if (GLOBAL_DB.studentsMapping[token].toLowerCase() === studentName.toLowerCase()) { foundToken = token; break; }
    }
    if (!foundToken) { alert("לא נמצא מפתח אישי לתלמיד זה."); return; }
    const finalUrl = `${window.location.href.split('?')[0]}?pw=${GLOBAL_DB.studentPw}&id=${foundToken}`;
    navigator.clipboard.writeText(finalUrl);
    copyBtn.innerHTML = "✅ הקישור הועתק!";
    setTimeout(() => copyBtn.innerHTML = '<i class="fa-solid fa-link me-1"></i> העתק קישור מוגן לתלמיד', 2500);
  }

  function copyDayUrl(dayName) {
    const iconEl = document.getElementById('shareIconObj');
    const baseUrl = window.location.href.split('?')[0];
    const finalUrl = `${baseUrl}?day=${dayName}`;
    navigator.clipboard.writeText(finalUrl);
    
    if (iconEl) {
      iconEl.className = "fa-solid fa-check text-success";
      setTimeout(() => { iconEl.className = "fa-solid fa-link text-muted"; }, 2000);
    }
  }

  function parseTimeToDecimal(timeStr) {
    const parts = timeStr.trim().split(':');
    if (parts.length < 2) return 0;
    return parseInt(parts[0], 10) + (parseInt(parts[1], 10) / 60);
  }

  function drawDaily(activeDay) {
    currentActiveDayGlobal = activeDay;
    const days = ["ראשון", "שני", "שלישי", "רביעי", "חמישי"];
    
    let tabsHtml = `<div class="sticky-header-container">`;
    tabsHtml += `<div class="d-flex justify-content-center gap-2 mb-2 no-print">`;
    days.forEach(day => {
      const activeClass = (day === activeDay) ? 'btn-primary' : 'btn-outline-primary';
      tabsHtml += `<button class="btn btn-sm ${activeClass} rounded-pill px-4 py-1.5 fw-bold" onclick="drawDaily('${day}')">יום ${day}</button>`;
    });
    tabsHtml += `</div>`;

    let isKiosk = document.body.classList.contains('kiosk-mode');
    
    if (isKiosk) {
      tabsHtml += `
        <div class="d-flex justify-content-between align-items-center mt-2 px-2">
          <div style="flex: 1;" class="text-end">
            <button class="btn btn-sm btn-danger rounded-pill px-3 py-1 fw-bold" style="font-size: 0.8rem;" onclick="toggleKioskMode('${activeDay}')">
              <i class="fa-solid fa-compress me-1"></i> יציאה ממסך מלא
            </button>
          </div>
          <div class="d-flex align-items-center justify-content-center gap-3">
            <h5 class="fw-bold m-0 text-dark">לוח זמנים מפורט - יום ${activeDay}</h5>
            <div class="live-clock-badge"><i class="fa-regular fa-clock"></i><span id="kioskLiveClock">--:--:--</span></div>
          </div>
          <div style="flex: 1;"></div>
        </div>`;
    } else {
      tabsHtml += `
        <div class="d-flex justify-content-center align-items-center flex-wrap gap-3 mt-2 px-2">
          <h5 class="fw-bold m-0 text-dark d-flex align-items-center gap-2" style="font-size: 1.15rem;">
            מערכת שעות - יום ${activeDay}
            <button class="day-share-icon-btn no-print" title="העתק קישור ליום זה" onclick="copyDayUrl('${activeDay}')">
              <i id="shareIconObj" class="fa-solid fa-link text-muted"></i>
            </button>
          </h5>
          <button class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1 fw-bold ms-auto ms-sm-0" style="font-size: 0.8rem;" onclick="toggleKioskMode('${activeDay}')">
            <i class="fa-solid fa-expand me-1"></i> מצב מסך מלא
          </button>
        </div>`;
    }
    tabsHtml += `</div>`;

    let contentHtml = `<div class="daily-rows-scroll-area">`;
    const rows = GLOBAL_DB.schedule[activeDay] || [];
    
    if (rows.length > 1) {
      const teachersHeaderRow = rows[0];
      const now = new Date();
      const currentTimeDecimal = now.getHours() + (now.getMinutes() / 60);

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const timeRangeString = (row[1] || "").trim();
        if (!timeRangeString) continue;

        let isTimeRowActive = false;
        if (timeRangeString.includes('-')) {
          const [startStr, endStr] = timeRangeString.split('-');
          const startDecimal = parseTimeToDecimal(startStr);
          const endDecimal = parseTimeToDecimal(endStr);
          if (currentTimeDecimal >= startDecimal && currentTimeDecimal < endDecimal) {
            isTimeRowActive = true;
          }
        }

        let hourlyLessonsHtml = "";
        let hasAnyLessonInHour = false;

        for (let j = 2; j < row.length; j++) {
          let cellData = (row[j] || "").trim();
          let teacherName = teachersHeaderRow[j] || "מורה";

          if (cellData) {
            hasAnyLessonInHour = true;
            const parts = cellData.split('-');
            let roomInfo = parts.length > 1 ? parts[0].trim() : "";
            let contentInfo = parts.length > 1 ? parts.slice(1).join('-').trim() : parts[0].trim();

            hourlyLessonsHtml += `
              <div class="lesson-slot-card">
                <div class="slot-top-line">
                  <span class="slot-teacher-text">${teacherName}</span>
                  ${roomInfo ? `<span class="slot-room-text"><i class="fa-solid fa-location-dot me-1" style="font-size:0.7rem;"></i>${roomInfo}</span>` : ''}
                </div>
                <div class="slot-main-info" title="${contentInfo}">
                  ${contentInfo}
                </div>
              </div>`;
          }
        }

        if (hasAnyLessonInHour) {
          contentHtml += `
            <div class="time-block-row shadow-sm ${isTimeRowActive ? 'active-time-row' : ''}">
              <div class="time-row-header">
                <i class="fa-regular fa-clock me-1" style="font-size: 0.95rem;"></i> ${timeRangeString}
              </div>
              <div class="time-lessons-container">
                ${hourlyLessonsHtml}
              </div>
            </div>`;
        }
      }

    } else {
      contentHtml += `<p class="text-center text-muted py-4">אין נתונים להצגה ליום ${activeDay}</p>`;
    }
    contentHtml += `</div>`;
    
    document.getElementById('dailyContent').innerHTML = tabsHtml + contentHtml;
    updateLiveClock(); 
  }

  function toggleKioskMode(activeDay) {
    const isActivating = !document.body.classList.contains('kiosk-mode');
    document.body.classList.toggle('kiosk-mode');
    if (isActivating) {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => console.log("Fullscreen error:", err));
      }
    } else {
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(err => console.log("Fullscreen exit error:", err));
      }
    }
    drawDaily(activeDay);
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      document.body.classList.remove('kiosk-mode');
      if (isTeacherMode) document.body.classList.add('teacher-view-mode');
      drawDaily(currentActiveDayGlobal);
    }
  });

  setInterval(() => {
    const dailyTab = document.getElementById('tab-daily');
    if (dailyTab && dailyTab.classList.contains('active') && dailyTab.style.display !== 'none') {
      drawDaily(currentActiveDayGlobal);
    }
  }, 30000);

  function renderSummary(reports, containerId) {
    const container = document.getElementById(containerId);
    if (!reports || reports.length === 0) { container.innerHTML = ""; return; }
    const stats = { total: reports.length, teachers: {} };
    reports.forEach(r => { stats.teachers[r.teacher] = (stats.teachers[r.teacher] || 0) + 1; });

    let html = `<span class="badge bg-primary me-2 mb-2 shadow-sm" onclick="filterByTeacherBubble('ALL', '${containerId}')">כל הדיווחים (${stats.total})</span>`;
    Object.keys(stats.teachers).sort().forEach(t => {
      html += `<span class="badge bg-custom-teacher me-2 mb-2 shadow-sm" onclick="filterByTeacherBubble('${t}', '${containerId}')">${t} (${stats.teachers[t]})</span>`;
    });
    container.innerHTML = html;
  }

  function filterByTeacherBubble(teacherName, containerId) {
    const isPersonal = (containerId === 'pSummary');
    document.getElementById(isPersonal ? 'pTeacher' : 'fTeacher').value = teacherName;
    const filtered = (teacherName === 'ALL') ? lastSearchResults : lastSearchResults.filter(r => r.teacher === teacherName);
    displayReportList(filtered, isPersonal ? 'pReportsList' : 'archiveContent');
  }

  function displayReportList(reports, listId) {
    const list = document.getElementById(listId);
    if (reports.length > 0) {
      list.innerHTML = reports.map(r => `
        <div class="report-item p-3 border-bottom">
          <div class="d-flex justify-content-between small mb-2">
            <span class="fw-bold text-primary" style="font-size:1rem">${r.teacher} | תלמיד: ${r.studentName}</span>
            <span class="text-muted"><i class="fa-regular fa-clock me-1"></i>${r.timestamp}</span>
          </div>
          <div class="text-dark bg-light p-2.5 rounded-2" style="font-size:0.95rem;">${r.content}</div>
        </div>
      `).join('');
    } else {
      list.innerHTML = `<p class="text-center p-4 text-muted">אין דיווחים מתאימים בנמצא.</p>`;
    }
  }

  function filterPersonalReports() {
    const q = document.getElementById('pSearch').value.trim().toLowerCase();
    const m = document.getElementById('pMonth').value;
    const t = document.getElementById('pTeacher').value;
    lastSearchResults = GLOBAL_DB.reports.filter(r => r.allText.includes(q) && (m === "ALL" || r.month === m));
    renderSummary(lastSearchResults, 'pSummary');
    const finalFiltered = (t === "ALL") ? lastSearchResults : lastSearchResults.filter(r => r.teacher === t);
    displayReportList(finalFiltered, 'pReportsList');
  }

  function applyFilters() {
    const m = document.getElementById('fMonth').value;
    const t = document.getElementById('fTeacher').value;
    const q = document.getElementById('fSearch').value.trim().toLowerCase();
    
    let filtered = GLOBAL_DB.reports;
    if (m !== "ALL") filtered = filtered.filter(r => r.month === m);
    lastSearchResults = filtered.filter(r => r.allText.includes(q));
    
    renderSummary(lastSearchResults, 'fSummary');
    const finalFiltered = (t === "ALL") ? lastSearchResults : lastSearchResults.filter(r => r.teacher === t);
    displayReportList(finalFiltered, 'archiveContent');
  }
</script>
</body>
</html>
