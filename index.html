<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מרכז למידה - ניהול ראשי</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #f1f5f9; font-family: 'Assistant', sans-serif; }
    .lobby-card { background: white; border-radius: 20px; padding: 30px; text-align: center; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-decoration: none; color: #1e293b; display: block; }
    .lobby-card:hover { transform: translateY(-10px); box-shadow: 0 20px 25px rgba(0,0,0,0.1); }
    .icon-box { font-size: 3rem; color: #0d9488; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="container mt-5">
  <h1 class="text-center mb-5 fw-bold">ברוכים הבאים למרכז הלמידה</h1>
  
  <div class="row g-4">
    <div class="col-md-4">
      <a href="daily.html" class="lobby-card">
        <div class="icon-box"><i class="fa-solid fa-calendar-days"></i></div>
        <h3>לוח זמנים יומי</h3>
        <p class="text-muted">צפייה בשיעורים בזמן אמת</p>
      </a>
    </div>
    
    <div class="col-md-4">
      <a href="student.html" class="lobby-card">
        <div class="icon-box"><i class="fa-solid fa-user-graduate"></i></div>
        <h3>ניהול תלמידים</h3>
        <p class="text-muted">פרטים אישיים וסטטוס לימודי</p>
      </a>
    </div>
    
    <div class="col-md-4">
      <a href="archive.html" class="lobby-card">
        <div class="icon-box"><i class="fa-solid fa-box-archive"></i></div>
        <h3>ארכיון היסטורי</h3>
        <p class="text-muted">צפייה בנתוני עבר ודוחות</p>
      </a>
    </div>
  </div>
</div>

</body>
</html>
