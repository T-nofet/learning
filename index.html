<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפוס למידה דיגיטלי</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --primary: #1e3a8a; --accent: #0d9488; --bg-main: #f8fafc; --transition: all 0.3s ease; }
    body { background-color: var(--bg-main); font-family: 'Assistant', sans-serif; }
    
    /* עיצוב כרטיס שיעור עם הפס המתמלא */
    .slot-card { position: relative; background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; min-width: 220px; flex: 1; overflow: hidden; transition: var(--transition); }
    .current-slot { border: 2px solid var(--accent) !important; background-color: #f0fdfa !important; }
    .progress-fill { position: absolute; bottom: 0; left: 0; height: 5px; background: var(--accent); transition: width 0.5s linear; }
    
    /* מצב קיוסק (מסך מלא) */
    body.kiosk-mode .no-print, body.kiosk-mode .nav-pills { display: none !important; }
    body.kiosk-mode .main-container { max-width: 100% !important; margin: 0; border-radius: 0; min-height: 100vh; }
  </style>
</head>
<body>
<script>
  // ... (הלוגיקה של ההתחברות וה-GLOBAL_DB נשארת זהה) ...

  function drawDaily(activeDay) {
    const now = new Date();
    const currentHour = now.getHours() + (now.getMinutes() / 60);
    const rows = GLOBAL_DB.schedule[activeDay] || [];
    let isKiosk = document.body.classList.contains('kiosk-mode');
    
    let contentHtml = `<div class="d-flex justify-content-between mb-4">
        <button class="btn ${isKiosk ? 'btn-danger' : 'btn-primary'}" onclick="toggleKioskMode('${activeDay}')">
            ${isKiosk ? 'יציאה ממסך מלא' : 'מצב מסך מלא'}
        </button>
    </div>`;

    rows.slice(1).forEach(row => {
      let slotsHtml = "";
      for (let j = 2; j < rows[0].length; j++) {
        if (row[j] && row[j].trim()) {
            // חישוב זמן לטובת הפס המתמלא
            const [start, end] = rows[0][j].split('-').map(t => t.split(':').reduce((h, m) => parseInt(h) + parseInt(m)/60));
            const isCurrent = (currentHour >= start && currentHour < end);
            let progressHtml = '';
            
            if (isCurrent) {
                const pct = Math.min(100, ((currentHour - start) / (end - start)) * 100);
                progressHtml = `<div class="progress-fill" style="width: ${pct}%"></div>`;
            }

            slotsHtml += `
              <div class="slot-card shadow-sm ${isCurrent ? 'current-slot' : ''}">
                <div class="slot-header">${rows[0][j]}</div>
                <div class="slot-content">${row[j]}</div>
                ${progressHtml}
              </div>`;
        }
      }
      contentHtml += `<div class="teacher-row">${row[1]}<div class="slots-grid-container">${slotsHtml}</div></div>`;
    });

    document.getElementById('dailyContent').innerHTML = contentHtml;
    
    // גלילה אוטומטית במצב קיוסק
    if(isKiosk) {
        const active = document.querySelector('.current-slot');
        if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function toggleKioskMode(activeDay) {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
            document.body.classList.add('kiosk-mode');
            drawDaily(activeDay);
        });
    } else {
        document.exitFullscreen().then(() => {
            document.body.classList.remove('kiosk-mode');
            drawDaily(activeDay);
        });
    }
  }

  // עדכון אוטומטי של הפס כל 30 שניות
  setInterval(() => {
      if(document.querySelector('#tab-daily.active')) drawDaily(document.querySelector('.btn-primary').innerText.includes('יום') ? 'ראשון' : 'ראשון');
  }, 30000);

</script>
</body>
</html>
