<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { 
      background-color: transparent !important; 
      font-family: 'Assistant', sans-serif; 
      color: #333; 
      padding-bottom: 20px;
      margin: 0;
      width: 100%;
      overflow-x: hidden;
    }
    
    header { display: none !important; }
    
    .search-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 15px; 
      margin-bottom: 15px;
      margin-top: 15px;
      width: 100%;
    }
    
    .search-wrapper {
      max-width: 400px;
      flex-grow: 1;
    }

    .filter-box { 
      background: white; 
      border-radius: 50px; 
      padding: 6px 16px !important;
      border: 1px solid #e0e0e0; 
      display: inline-flex; 
      align-items: center;
      justify-content: space-between;
      white-space: nowrap; 
      min-width: 150px !important; 
    }

    #examList {
      direction: rtl !important;
      justify-content: flex-start !important;
      text-align: right !important;
    }

    .exam-card { 
      border: none; 
      border-radius: 14px; 
      transition: 0.25s; 
      display: flex; 
      flex-direction: column; 
      border-right: 5px solid #dee2e6; 
      position: relative;
      background: white;
      min-height: 145px;
      text-align: right !important; 
    }
    .exam-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.06); }
    
    .type-מבחן { border-right-color: #ff4d4d; background-color: #fff5f5; }
    .type-בוחן { border-right-color: #ffd43b; background-color: #fffdf2; }
    .type-אירוע { border-right-color: #51cf66; background-color: #f2fbf3; }

    .status-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 6px; font-weight: 700; margin-bottom: 4px; display: inline-block; }
    .past-event { opacity: 0.55; }
    .today-event { border: 2px solid #fab005 !important; box-shadow: 0 0 10px rgba(250, 176, 5, 0.2); }

    .search-pill { border-radius: 50px; padding: 6px 15px; border: 1px solid #e0e0e0; box-shadow: 0 2px 6px rgba(0,0,0,0.01); width: 100%; font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="container-fluid px-3 mt-1">
  
  <div class="search-container">
    <div class="search-wrapper">
      <input type="text" id="searchInput" oninput="applyFilters()" class="form-control search-pill" placeholder="חיפוש לפי נושא או שם נער...">
    </div>
    <div>
      <div class="filter-box shadow-sm">
        <div class="d-flex align-items-center w-100" style="direction: ltr !important;">
          <input class="form-check-input m-0" type="checkbox" id="regOnly" onchange="applyFilters()" style="cursor: pointer;">
          <span class="small fw-bold text-primary mb-0" style="margin-left: 10px; direction: rtl; cursor: pointer;" onclick="document.getElementById('regOnly').click()">רשומים בלבד</span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="text-center mb-3">
    <div id="statusCount" class="text-muted small fw-light" style="font-size: 0.8rem;">טוען נתונים מקמפוס גוגל...</div>
  </div>

  <div id="examList" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-4 g-3 text-end"></div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLaC4Ml1fRqsxvv1ITtC4JSJ1vjblgkhWHbOw9_faYrgcH0e_7lcHXQcOquZBp1-g/exec"; 

  let allExams = [];

  window.onload = () => {
    loadData();
  };

  // מנגנון זיהוי תאריכים חסין שגיאות
  function parseDateHe(s) {
    if (!s) return new Date(0);
    
    // במידה והנתון כבר הגיע כאובייקט Date מפורמט ב-JSON
    let dObj = new Date(s);
    if (!isNaN(dObj.getTime())) return dObj;

    const p = s.toString().trim().split('/');
    if(p.length < 3) return new Date(0);
    
    let n1 = parseInt(p[0], 10), n2 = parseInt(p[1], 10), y = parseInt(p[2], 10);
    if(y < 100) y += 2000;

    // זיהוי אם התאריך נכתב בפורמט אמריקאי (MM/DD/YYYY) או ישראלי (DD/MM/YYYY)
    if (n1 > 12) {
      // n1 הוא היום (למשל 19/8/2026)
      return new Date(y, n2 - 1, n1);
    } else if (n2 > 12) {
      // n2 הוא היום (למשל 8/19/2026)
      return new Date(y, n1 - 1, n2);
    } else {
      // ברירת מחדל לפורמט ישראלי DD/MM/YYYY
      return new Date(y, n2 - 1, n1);
    }
  }

  function loadData() {
    fetch(`${GOOGLE_SCRIPT_URL}?action=getExams&pw=111`)
      .then(response => {
        if (!response.ok) throw new Error("תגובת שרת לא תקינה");
        return response.json();
      })
      .then(data => {
        if (Array.isArray(data)) {
          allExams = data.sort((a,b) => parseDateHe(a.date) - parseDateHe(b.date));
          draw();
        } else if (data.error) {
          throw new Error(data.error);
        } else {
          throw new Error("מבנה נתונים לא מזוהה");
        }
      })
      .catch(err => {
        document.getElementById('statusCount').innerText = "שגיאה בטעינת הנתונים: " + err.message;
        console.error(err);
      });
  }

  function draw() {
    const list = document.getElementById('examList');
    const today = new Date(); today.setHours(0,0,0,0);
    list.innerHTML = '';

    allExams.forEach(ex => {
      const dateObj = parseDateHe(ex.date);
      const diff = Math.ceil((dateObj - today) / 86400000);
      let bTxt = diff === 0 ? "היום" : (diff === 1 ? "מחר" : (diff < 0 ? "עבר" : `בעוד ${diff} ימים`));
      let bClass = diff === 0 ? "bg-warning text-dark" : (diff < 0 ? "bg-light text-muted" : "bg-primary text-white");

      const rawDate = ex.date ? ex.date.toString() : '';
      const cleanDate = rawDate.replace(/\/\d{4}/, '');
      const desc = ex.description || '';
      const type = ex.type || 'מבחן';
      const students = ex.students || '';
      const day = ex.day || '';

      const col = document.createElement('div');
      col.className = "col card-wrapper";
      if(diff < 0) col.classList.add('past-event');
      
      col.setAttribute('data-search', `${desc} ${students} ${type} ${day}`.toLowerCase());
      col.setAttribute('data-reg', students.trim() !== "" ? "y" : "n");

      col.innerHTML = `
        <div class="card exam-card shadow-sm type-${type} ${diff===0?'today-event':''}">
          <div class="card-body p-2 d-flex flex-column justify-content-between" style="padding: 12px !important;">
            <div>
              <span class="status-badge ${bClass}">${bTxt}</span>
              <div class="text-muted small fw-bold mb-1" style="font-size: 0.75rem;">${day} | ${cleanDate}</div>
              <h5 class="fw-bold mb-2 h6 text-dark" style="line-height:1.3; font-size: 0.88rem;">${desc}</h5>
            </div>
            <div class="p-2 bg-white bg-opacity-60 rounded-3" style="font-size: 0.75rem; padding: 6px !important;">
              <strong style="font-size:0.65rem" class="text-primary d-block mb-1">רשומים:</strong>
              ${students ? students : '<span class="text-muted italic">אין רשומים</span>'}
            </div>
          </div>
        </div>`;
      list.appendChild(col);
    });
    applyFilters();
  }

  function applyFilters() {
    const term = document.getElementById('searchInput').value.toLowerCase().trim();
    const onlyReg = document.getElementById('regOnly').checked;
    let count = 0;
    
    document.querySelectorAll('.card-wrapper').forEach(c => {
      const sMatch = c.getAttribute('data-search').includes(term);
      const rMatch = !onlyReg || c.getAttribute('data-reg') === "y";
      
      if(sMatch && rMatch) { 
        c.classList.remove('d-none'); 
        count++; 
      } else { 
        c.classList.add('d-none'); 
      }
    });
    document.getElementById('statusCount').innerText = `מציג ${count} אירועים`;
  }
</script>
</body>
</html>
